#
# mGPU suite definitions for the work-queue scheduler (run_queue.sh --queue mgpu).
# Format: <label>  <logfile>  <mode>  <command> [args...]
#
#   mode=list    suite honours TE_CI_LIST_ITEMS, so it is expanded into one work
#                item per test invocation. Each item runs on the GPU count its call
#                site declares with TE_CI_GPUS=N, or on the whole box if it declares
#                none, and items that fit side by side share the box.
#   mode=opaque  suite is scheduled as a single work item on the whole box.
#
# The labels differ from the sGPU queue's so the two can share a test-results tree:
# JUnit XML lands in <JUNITXML_PREFIX><label>/.
torch-mgpu  torch_mgpu.log  list    ci/pytorch.sh
jax-mgpu    jax_mgpu.log    list    ci/jax.sh
