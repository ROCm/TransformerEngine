# bandit configuration
# Reference: https://bandit.readthedocs.io/en/latest/config.html
# Local scan: bandit --recursive . --configfile .github/scan_tools_configs/bandit.yml
#
# Bandit configuration for this repository's security scans.
#
# This file defines the complete scanner policy;
# Keep repository-specific suppressions and tuning here.
#
# Bandit has no ignore file. Suppress a finding with:
#
#   1. `# nosec <test ID>` on the flagged line:
#          subprocess.run(cmd, shell=True)  # nosec B602 # cmd is a constant
#
#   2. `skips:` for test IDs disabled across the repository:
#          skips: [B101]
#
#   3. `exclude_dirs:` below for paths Bandit should not scan.

# Environment and generated-output exclusions support local scans; these
# paths are absent from clean CI checkouts.

# TransformerEngine's bandit config started from the shared default and
# replaces it wholesale, so it carries both the generic excludes and
# TE-specific tuning.

exclude_dirs:
  # Bandit matches entries as plain substrings, globs are not supported
  # Entries here are slash-anchored:
  # a bare `dist` would also drop `distributed.py`, `build` - all of
  # `build_tools/`, `.git` - `.github`, `venv` -> `.venv` and so on.
  - .git/
  - venv
  - build/
  - dist/
  - node_modules
  - __pycache__
  # Sample code (top-level `examples/` and `docs/examples/`), not shipped
  # with the library.
  - /examples/
  # Upstream test and benchmark scripts; not used by ROCm CI
  - /benchmarks/attention/benchmark_attention.py
  - /tests/pytorch/test_onnx_export.py

# Plugin settings. B101 (assert_used) only matters for code that may run
# under `python -O`; pytest-style tests and benchmarks rely on assert by
# design. Patterns are fnmatch globs against the file path.
assert_used:
  skips:
    - '*/tests/*'
    - '*/benchmarks/*'

# B614 (pytorch_load, unsafe torch.load/weights_only) and B301 (pickle.loads)
# have no per-path config option like assert_used above; the only choices
# bandit offers are a `# nosec` on every call site or disabling the rules
# everywhere. Both disabled globally:
#   - B614: almost every instance is test code loading its own fixtures.
#   - B614/B301: the only production-code instances are reached disabled by 
#     default, enabling requires setting NVTE_ALLOW_UNSAFE_PICKLE_EXTRA_STATE=1
skips: ['B614', 'B301']
