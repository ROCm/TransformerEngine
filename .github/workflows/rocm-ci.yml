name: Build and Test Branch
run-name: CI Level ${{ (github.event_name == 'push' && '3') || inputs.test_level || '1' }}

on:
  push:
    branches:
      - 'dev'
      - 'release_v2.*_rocm'
  workflow_call:
    inputs:
      test_level:
        description: 'Test Level (1-3)'
        required: false
        default: '1'
        type: string
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test Level (1-3)'
        required: true
        default: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_LEVEL: ${{ (github.event_name == 'push' && '3') || inputs.test_level || '1' }}
  # CI runtime data, relative to the repo root: test-results/, plus weights/ and
  # rerun/ kept by actions/cache. ci/run_queue.sh reads the same variable.
  TE_CI_DATA_DIR: ci-data

jobs:
  # Which suites this run needs. A PR runs only the suites its changed paths affect
  # (.github/scripts/change_scope.py, the PR's own copy); pushes, manual runs and
  # PRs labelled ci-skip-scope run every suite.
  scope:
    name: Select Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_build: ${{ steps.scope.outputs.run_build }}
      sgpu_suites: ${{ steps.scope.outputs.sgpu_suites }}
      mgpu_suites: ${{ steps.scope.outputs.mgpu_suites }}
      # "Re-run failed jobs" copies this job and its outputs from the earlier
      # attempt; "Re-run all jobs" runs it again. The GPU jobs tell the two apart
      # by comparing this with the current attempt.
      ran_in_attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # A PR is diffed against its base branch, which needs the history
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Select suites
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          SKIP_SCOPE: ${{ contains(github.event.pull_request.labels.*.name, 'ci-skip-scope') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          everything() {
            python3 .github/scripts/change_scope.py --all "$1" \
              --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          }

          if [[ "$EVENT" != "pull_request" ]]; then
            everything "${EVENT} runs are not gated"
            exit 0
          fi
          if [[ "$SKIP_SCOPE" == "true" ]]; then
            everything "the PR is labelled ci-skip-scope"
            exit 0
          fi

          # The whole PR against its merge base, not just the latest push.
          # --no-renames lists a moved file at both its old and its new path.
          if ! git diff --name-status --no-renames "${BASE_SHA}...${HEAD_SHA}" > /tmp/changed.txt; then
            echo "::warning::could not list the PR's changes; running every suite"
            everything "the PR's changes could not be listed"
            exit 0
          fi
          if ! python3 .github/scripts/change_scope.py --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" \
                < /tmp/changed.txt; then
            echo "::warning::.github/scripts/change_scope.py failed; running every suite"
            everything "the gating rules failed"
          fi

  build:
    needs: scope
    if: needs.scope.outputs.run_build == 'true'
    # Delegate wheel building to the reusable workflow on dev. It produces a core .whl plus framework .tar.gz sdists under artifact name `te-rocm-wheels`.
    uses: ./.github/workflows/rocm-wheels-build.yml
    secrets: inherit

  sgpu_tests:
    name: sGPU Tests (${{ matrix.arch_label }})
    needs: [scope, build]
    if: needs.scope.outputs.sgpu_suites != ''
    timeout-minutes: 270
    runs-on: ${{ matrix.arch_label == 'mi30x' && 'linux-te-mi30x-4' || matrix.arch_label == 'mi35x' && 'linux-te-mi35x-4' }}
    env:
      SUITES: ${{ needs.scope.outputs.sgpu_suites }}
      GPU_ARCH: ${{ matrix.arch_label == 'mi30x' && 'gfx942' || 'gfx950' }}
    strategy:
      fail-fast: false
      matrix:
        arch_label: [mi30x, mi35x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize required submodules
        run: |
          git submodule update --init --recursive --depth 1 \
            3rdparty/googletest \
            3rdparty/hipify_torch \
            3rdparty/composable_kernel

      - name: Host Diagnostics
        run: |
          echo "::group::Host Diagnostics"
          echo ">>> GPU info:"
          ls -l /dev/dri
          ls -l /dev/kfd
          rocm-smi
          echo "::endgroup::"

      # Download artifacts and set up the test container concurrently
      - parallel:
          - name: Download build artifacts
            uses: actions/download-artifact@v8
            with:
              name: te-rocm-wheels
              path: dist/

          - &start_container
            name: Start container
            run: |
              DEVICE_FLAG="$(cat /etc/podinfo/gha-render-devices 2>/dev/null || echo --device=/dev/dri)"
              test -n "$DEVICE_FLAG"
              echo "Using device flag: $DEVICE_FLAG"
              # A plain OS image: install_deps.sh installs each framework the job's suites
              # use into its own venv, for this runner's GPU arch; each suite runs in its own.
              FRAMEWORKS=""
              for suite in $SUITES; do
                case "$suite" in
                  torch|torch-mgpu|core) FRAMEWORKS="$FRAMEWORKS torch" ;;
                  jax|jax-mgpu) FRAMEWORKS="$FRAMEWORKS jax" ;;
                  *) FRAMEWORKS="$FRAMEWORKS torch jax" ;;
                esac
              done
              FRAMEWORKS=$(printf '%s\n' $FRAMEWORKS | sort -ur | xargs)
              VENV_ENV=()
              for fw in $FRAMEWORKS; do
                VENV_ENV+=(-e "TE_CI_${fw^^}_VENV=/opt/venv-$fw")
              done
              # The queue's own Python (GPU probes, CK JIT prebuild) runs in the first venv:
              # torch when the job has it
              DEFAULT_VENV=/opt/venv-${FRAMEWORKS%% *}
              . ci/deps/requirements/config.env
              SECONDS=0
              docker pull "$TE_CI_BASE_IMAGE"
              docker run -dt \
                --rm \
                --name te-runner \
                --network=host \
                --device=/dev/kfd $DEVICE_FLAG \
                --shm-size=16G \
                --pid=host \
                --group-add $(getent group render | cut -d: -f3) \
                --group-add $(getent group video | cut -d: -f3) \
                "${VENV_ENV[@]}" \
                -e VIRTUAL_ENV=$DEFAULT_VENV \
                -e PATH=$DEFAULT_VENV/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                -v "${{ github.workspace }}:/workspace" \
                -w /workspace \
                "$TE_CI_BASE_IMAGE"
              for fw in $FRAMEWORKS; do
                docker exec -e TE_CI_DEPS_SUMMARY=/workspace/deps-summary-$fw.md te-runner \
                  bash ci/install_deps.sh "$GPU_ARCH" --frameworks "$fw"
              done
              echo "Test environment ready in ${SECONDS} s"
              for fw in $FRAMEWORKS; do
                cat "deps-summary-$fw.md"
              done >> "$GITHUB_STEP_SUMMARY"

      - &install_packages
        name: Install packages
        run: |
          docker exec te-runner bash -c "$(cat <<'EOF'
          set -ex
          # core (cpp) tests build via cmake inside the repo; allow git ops in-tree.
          git config --global --add safe.directory '*'

          TE_CORE_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm[0-9]*.whl' | sort | head -n 1)
          TE_TORCH_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_torch*.tar.gz' | sort | head -n 1)
          TE_JAX_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_jax*.tar.gz' | sort | head -n 1)
          test -n "$TE_CORE_PKG" && test -n "$TE_TORCH_PKG" && test -n "$TE_JAX_PKG"

          # Each framework venv the job has gets the core wheel and its own package,
          # built with only that venv on PATH. The build tools are in the locks.
          if [ -n "${TE_CI_TORCH_VENV:-}" ]; then
            ( export VIRTUAL_ENV="$TE_CI_TORCH_VENV" PATH="$TE_CI_TORCH_VENV/bin:$PATH"
              pip install --no-deps "$TE_CORE_PKG"
              pip install --no-build-isolation --no-deps "$TE_TORCH_PKG" )
          fi
          if [ -n "${TE_CI_JAX_VENV:-}" ]; then
            ( export VIRTUAL_ENV="$TE_CI_JAX_VENV" PATH="$TE_CI_JAX_VENV/bin:$PATH"
              pip install --no-deps "$TE_CORE_PKG"
              pip install --no-build-isolation --no-deps "$TE_JAX_PKG" )
          fi
          EOF
          )"

      - name: Restore learned test weights
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/weights
          key: te-sgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-sgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-

      # What failed on an earlier attempt of this run, restored only on "Re-run
      # failed jobs" (the scope job was copied, not re-run). A first attempt and
      # "Re-run all jobs" run the whole queue.
      - name: Restore the previous attempt's failed items
        if: needs.scope.outputs.ran_in_attempt != github.run_attempt
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/rerun
          key: te-sgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-sgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-

      - name: Run sGPU tests as one queue (pytorch, jax, examples, core)
        id: run-tests
        # Below the job's timeout-minutes so an overrun kills only this step;
        # the `if: always()` report + upload steps still run (artifacts survive).
        timeout-minutes: 240
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # One subdir per suite so PyTorch/JAX/Core get independent reports and
          # never collide on identically-named XML (e.g. test_sanity_import.auto.xml
          # exists in both the torch and jax suites and runs in parallel).
          rm -rf "$TE_CI_DATA_DIR/test-results"

          mkdir -p "$TE_CI_DATA_DIR/weights"
          wc -l "$TE_CI_DATA_DIR"/weights/*.txt 2>/dev/null \
            || echo "no weight table restored; this run will be unordered"

          mkdir -p "$TE_CI_DATA_DIR/rerun"
          wc -l "$TE_CI_DATA_DIR"/rerun/sgpu/*.tsv 2>/dev/null \
            || echo "no failed-item list restored; this run queues every suite"
          # Present only for items the last attempt could narrow to single tests
          wc -l "$TE_CI_DATA_DIR"/rerun/sgpu/tests/*.txt 2>/dev/null \
            || echo "no per-test lists restored; any queued item re-runs whole"

          # No core dumps: a crashing test would leave a root-owned, mode 0600 GPU
          # core dump in the uploaded results, which fails the log upload.
          docker exec \
            -e TEST_LEVEL=${{ env.TEST_LEVEL }} \
            -e TE_CI_DATA_DIR \
            -e JUNITXML_PREFIX="/workspace/$TE_CI_DATA_DIR/test-results/" \
            -e JUNITXML_SUFFIX=.xml \
            -e HF_TOKEN="$HF_TOKEN" \
            -e GITHUB_ACTIONS \
            -e TE_CI_SUITES="${{ needs.scope.outputs.sgpu_suites }}" \
            te-runner bash -c "ulimit -c 0; exec bash /workspace/ci/run_queue.sh --queue sgpu \
              --log-dir /workspace/$TE_CI_DATA_DIR/test-results/logs"

      - name: Save learned test weights
        if: always() && hashFiles(format('{0}/weights/*', env.TE_CI_DATA_DIR)) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/weights
          key: te-sgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate test report
        if: always()
        env:
          ATTEMPT: ${{ github.run_attempt }}
          SUITES: ${{ needs.scope.outputs.sgpu_suites }}
        run: |
          # "Re-run failed jobs" copies passed jobs, summaries included, into the
          # new attempt, so say which attempt wrote this one
          echo "Results from attempt ${ATTEMPT} of this run." >> "$GITHUB_STEP_SUMMARY"
          command -v python3 >/dev/null 2>&1 || { echo "python3 not available; skipping report"; exit 0; }

          # One report per suite; each appends its own section to the job summary.
          # An attempt reports only what it ran (GitHub keeps a summary per
          # attempt). A suite a re-run skipped says so; any other empty suite dir is
          # reported as a crash. Unselected suites are named in the schedule.
          report() {
            [[ " $SUITES " == *" $1 "* ]] || return 0
            python3 ci/junit_report.py "$TE_CI_DATA_DIR/test-results/$1" --title "$2"
          }
          report torch "sGPU PyTorch (${{ matrix.arch_label }})"
          report jax "sGPU JAX (${{ matrix.arch_label }})"
          report examples "sGPU Examples (${{ matrix.arch_label }})"
          report core "sGPU Core (${{ matrix.arch_label }})"
          if [ -f "$TE_CI_DATA_DIR/test-results/logs/report/schedule.md" ]; then
            cat "$TE_CI_DATA_DIR/test-results/logs/report/schedule.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no schedule.md -- the queue did not reach its report phase"
          fi

      # Saved per attempt, even when empty, so the next attempt restores this
      # attempt's list rather than an older one.
      - name: Save this attempt's failed items
        if: always() && hashFiles(format('{0}/rerun/**', env.TE_CI_DATA_DIR)) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/rerun
          key: te-sgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check suite failure status
        if: always()
        run: |
          EXIT_STATUS=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue
            read -r label logfile rest <<< "$line"
            rc=$(cat "$TE_CI_DATA_DIR/test-results/logs/suites/${logfile}.rc" 2>/dev/null || echo "missing")
            [[ "$rc" == "0" ]] && continue
            echo "::error::${label} tests FAILED (rc=${rc})."
            EXIT_STATUS=1
            for f in "$TE_CI_DATA_DIR"/test-results/logs/items/"${label}".*.log; do
              [[ -e "$f" ]] || continue
              irc=$(cat "${f}.rc" 2>/dev/null || echo 1)
              [[ "$irc" == "0" ]] && continue
              echo "::group::[FAILED] $(basename "$f" .log) (rc=${irc})"
              cat "$f"
              echo "::endgroup::"
            done
          done < ci/ci_sgpu_queue.conf
          exit $EXIT_STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-sgpu-${{ matrix.arch_label }}
          path: ${{ env.TE_CI_DATA_DIR }}/**
          if-no-files-found: ignore
          retention-days: 5
          # A re-run uploads under the same name; replace the earlier attempt's logs
          overwrite: true

      - name: Cleanup container
        if: always()
        run: docker rm -f te-runner || true

  # PyTorch and JAX multi-GPU tests share one 8-GPU runner as a single queue.
  # Each item runs on the whole box, one after another -- see ci/run_queue.sh.
  mgpu_tests:
    name: mGPU Tests (${{ matrix.arch_label }})
    needs: [scope, build]
    if: needs.scope.outputs.mgpu_suites != ''
    timeout-minutes: 240
    runs-on: ${{ matrix.arch_label == 'mi30x' && 'linux-te-mi30x-8' || matrix.arch_label == 'mi35x' && 'linux-te-mi35x-8' }}
    env:
      SUITES: ${{ needs.scope.outputs.mgpu_suites }}
      GPU_ARCH: ${{ matrix.arch_label == 'mi30x' && 'gfx942' || 'gfx950' }}
    strategy:
      fail-fast: false
      matrix:
        arch_label: [mi30x, mi35x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Host Diagnostics
        run: |
          echo "::group::Host Diagnostics"
          echo ">>> GPU info:"
          ls -l /dev/dri
          ls -l /dev/kfd
          rocm-smi
          echo "::endgroup::"

      # Download artifacts and set up the test container concurrently
      - parallel:
          - name: Download build artifacts
            uses: actions/download-artifact@v8
            with:
              name: te-rocm-wheels
              path: dist/

          - *start_container

      - *install_packages

      # What failed on an earlier attempt of this run; see the sGPU job.
      - name: Restore the previous attempt's failed items
        if: needs.scope.outputs.ran_in_attempt != github.run_attempt
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/rerun
          key: te-mgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-mgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-

      - name: Run mGPU tests as one queue (pytorch, jax)
        id: run-tests
        # Below the job's timeout-minutes so an overrun kills only this step;
        # the `if: always()` report + upload steps still run (artifacts survive).
        timeout-minutes: 180
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf "$TE_CI_DATA_DIR/test-results"

          mkdir -p "$TE_CI_DATA_DIR/rerun"
          wc -l "$TE_CI_DATA_DIR"/rerun/mgpu/*.tsv 2>/dev/null \
            || echo "no failed-item list restored; this run queues every suite"
          wc -l "$TE_CI_DATA_DIR"/rerun/mgpu/tests/*.txt 2>/dev/null \
            || echo "no per-test lists restored; any queued item re-runs whole"

          docker exec \
            -e TEST_LEVEL=${{ env.TEST_LEVEL }} \
            -e TE_CI_DATA_DIR \
            -e JUNITXML_PREFIX="/workspace/$TE_CI_DATA_DIR/test-results/" \
            -e JUNITXML_SUFFIX=.xml \
            -e HF_TOKEN="$HF_TOKEN" \
            -e GITHUB_ACTIONS \
            -e TE_CI_SUITES="${{ needs.scope.outputs.mgpu_suites }}" \
            te-runner bash -c "ulimit -c 0; exec bash /workspace/ci/run_queue.sh --queue mgpu \
              --log-dir /workspace/$TE_CI_DATA_DIR/test-results/logs"

      - name: Generate test report
        if: always()
        env:
          ATTEMPT: ${{ github.run_attempt }}
          SUITES: ${{ needs.scope.outputs.mgpu_suites }}
        run: |
          # "Re-run failed jobs" copies passed jobs, summaries included, into the
          # new attempt, so say which attempt wrote this one
          echo "Results from attempt ${ATTEMPT} of this run." >> "$GITHUB_STEP_SUMMARY"
          command -v python3 >/dev/null 2>&1 || { echo "python3 not available; skipping report"; exit 0; }
          # Unselected suites have no report; the schedule report names them
          report() {
            [[ " $SUITES " == *" $1 "* ]] || return 0
            python3 ci/junit_report.py "$TE_CI_DATA_DIR/test-results/$1" --title "$2"
          }
          report torch-mgpu "mGPU PyTorch (${{ matrix.arch_label }})"
          report jax-mgpu "mGPU JAX (${{ matrix.arch_label }})"
          if [ -f "$TE_CI_DATA_DIR/test-results/logs/report/schedule.md" ]; then
            cat "$TE_CI_DATA_DIR/test-results/logs/report/schedule.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no schedule.md -- the queue did not reach its report phase"
          fi

      - name: Save this attempt's failed items
        if: always() && hashFiles(format('{0}/rerun/**', env.TE_CI_DATA_DIR)) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/rerun
          key: te-mgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check suite failure status
        if: always()
        run: |
          EXIT_STATUS=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue
            read -r label logfile rest <<< "$line"
            rc=$(cat "$TE_CI_DATA_DIR/test-results/logs/suites/${logfile}.rc" 2>/dev/null || echo "missing")
            [[ "$rc" == "0" ]] && continue
            echo "::error::${label} tests FAILED (rc=${rc})."
            EXIT_STATUS=1
            for f in "$TE_CI_DATA_DIR"/test-results/logs/items/"${label}".*.log; do
              [[ -e "$f" ]] || continue
              irc=$(cat "${f}.rc" 2>/dev/null || echo 1)
              [[ "$irc" == "0" ]] && continue
              echo "::group::[FAILED] $(basename "$f" .log) (rc=${irc})"
              cat "$f"
              echo "::endgroup::"
            done
          done < ci/ci_mgpu_queue.conf
          exit $EXIT_STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-mgpu-${{ matrix.arch_label }}
          path: ${{ env.TE_CI_DATA_DIR }}/**
          if-no-files-found: ignore
          retention-days: 5
          overwrite: true

      - name: Cleanup container
        if: always()
        run: docker rm -f te-runner || true
