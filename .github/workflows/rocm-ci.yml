name: Build and Test Branch
run-name: CI Level ${{ (github.event_name == 'push' && '3') || inputs.test_level || '1' }}

on:
  push:
    branches:
      - 'dev'
      - 'release_v2.*_rocm'
  workflow_call:
    inputs:
      test_level:
        description: 'Test Level (1-3)'
        required: false
        default: '1'
        type: string
      docker_image_override:
        description: 'Manual Docker Image (Leave empty to use config file value)'
        required: false
        type: string
      test_config_from_source:
        description: 'DEBUG: Use config.json from current source branch instead of dev'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test Level (1-3)'
        required: true
        default: '1'
      docker_image_override:
        description: 'Manual Docker Image (Leave empty to use config file value)'
        required: false
        type: string
      test_config_from_source:
        description: 'DEBUG: Use config.json from current source branch instead of dev'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_LEVEL: ${{ (github.event_name == 'push' && '3') || inputs.test_level || '1' }}

jobs:
  select_image:
    name: Select Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image-tag: ${{ steps.select-image.outputs.image-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.test_config_from_source && github.ref_name || github.event.repository.default_branch || 'dev' }}
          sparse-checkout: ci/ci_config.json
          sparse-checkout-cone-mode: false

      - name: Select Docker Image Tag
        id: select-image
        run: |
          if [[ "${{ inputs.test_config_from_source }}" == "true" ]]; then
             echo "::notice::Debugging mode: Using ci/ci_config.json from ${{ github.ref_name }}"
          else
             echo "::notice::Using ci/ci_config.json from ${{ github.event.repository.default_branch || 'dev' }}"
          fi

          if [[ ! -f "ci/ci_config.json" ]]; then
             echo "::error::Config file not found in checkout."
             exit 1
          fi

          BRANCH_NAME="${{ github.base_ref || github.ref_name }}"
          echo "Determining image for branch: $BRANCH_NAME"
          VERSION_KEY="$BRANCH_NAME"

          if jq -e --arg key "$VERSION_KEY" '.docker_images[$key]' ci/ci_config.json > /dev/null; then
            JSON_KEY="$VERSION_KEY"
          else
            JSON_KEY="default"
          fi

          echo "Selected config key: $JSON_KEY"
          IMAGE_TO_USE=$(jq -r --arg key "$JSON_KEY" '.docker_images[$key]' ci/ci_config.json)

          MANUAL_OVERRIDE="${{ inputs.docker_image_override }}"
          if [[ -n "$MANUAL_OVERRIDE" ]]; then
            echo "::notice::Manual override detected: $MANUAL_OVERRIDE"
            IMAGE_TO_USE="$MANUAL_OVERRIDE"
          fi

          echo "Selected image: $IMAGE_TO_USE"
          echo "image-tag=$IMAGE_TO_USE" >> $GITHUB_OUTPUT

  build:
    name: Build Wheel
    needs: select_image
    timeout-minutes: 120
    runs-on: build-only-te
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize required submodules
        run: |
          git submodule update --init --recursive --depth 1 \
            3rdparty/aotriton \
            3rdparty/aiter \
            3rdparty/hipify_torch \
            3rdparty/QoLA

      - name: Pull Docker Image
        run: |
          docker pull ${{ needs.select_image.outputs.image-tag }}

      - name: Build Wheel
        run: |
          docker run --rm \
            --network=host \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ needs.select_image.outputs.image-tag }} \
            bash -c "$(cat <<'EOF'
          set -ex

          export HIP_PATH=""
          export PYTORCH_ROCM_ARCH="gfx942;gfx950"
          export NVTE_ROCM_ARCH="gfx942;gfx950"
          export NVTE_SKIP_SUBMODULE_CHECKS_DURING_BUILD=1
          export NVTE_AITER_PREBUILT_BASE_URL=https://compute-artifactory.amd.com:5000/artifactory/rocm-generic-local/te-ci/aiter-prebuilts
          pip install ninja
          git config --global --add safe.directory /workspace
          git submodule foreach --recursive 'git config --global --add safe.directory /workspace/$sm_path'
          NVTE_RELEASE_BUILD=1 pip wheel --no-build-isolation --no-deps -v . -w /workspace/dist/ 2>&1

          # Framework extensions ship as sdists as tar.gz. Wheels are build against the consumer's torch/jax at install time
          (cd transformer_engine/pytorch && NVTE_RELEASE_BUILD=1 python setup.py sdist -d /workspace/dist/)
          (cd transformer_engine/jax && NVTE_RELEASE_BUILD=1 python setup.py sdist -d /workspace/dist/)
          EOF
          )"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: te-wheel
          path: dist/*
          retention-days: 1

  sgpu_tests:
    name: sGPU Tests (${{ matrix.arch_label }})
    needs: [select_image, build]
    timeout-minutes: 360
    runs-on: ${{ matrix.arch_label == 'mi30x' && 'linux-te-mi30x-4' || 'linux-te-mi35x-4' }}
    strategy:
      fail-fast: false
      matrix:
        arch_label: [mi30x, mi35x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize required submodules
        run: |
          git submodule update --init --recursive --depth 1 \
            3rdparty/googletest \
            3rdparty/hipify_torch

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Host Diagnostics
        run: |
          echo "::group::Host Diagnostics"
          echo ">>> GPU info:"
          ls -l /dev/dri
          ls -l /dev/kfd
          rocm-smi
          echo "::endgroup::"

      - name: Pull Docker Image
        run: |
          docker pull ${{ needs.select_image.outputs.image-tag }}

      - name: Run Container
        run: |
          docker run -dt \
            --rm \
            --name te-runner \
            --network=host \
            --device=/dev/dri --device=/dev/kfd \
            --shm-size=16G \
            --pid=host \
            --group-add $(getent group render | cut -d: -f3) \
            --group-add $(getent group video | cut -d: -f3) \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ needs.select_image.outputs.image-tag }}

      - name: Install packages
        run: |
          docker exec te-runner bash -c "$(cat <<'EOF'
          set -ex
          # core (cpp) tests build via cmake inside the repo; allow git ops in-tree.
          git config --global --add safe.directory '*'

          install_if_present() {
            pkg="$1"
            label="$2"
            if [ -n "$pkg" ]; then
              echo "Installing $label package: $pkg"
              pip install --no-build-isolation --no-deps "$pkg" 2>&1
            else
              echo "No $label package found; using the monolithic wheel layout."
            fi
          }

          TE_CORE_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm[0-9]*.whl' | sort | head -n 1)
          TE_SPLIT_LAYOUT=1
          if [ -z "$TE_CORE_PKG" ]; then
            TE_CORE_PKG=$(find /workspace/dist -type f -name 'transformer_engine-[0-9]*.whl' | sort | head -n 1)
            TE_SPLIT_LAYOUT=0
          fi
          test -n "$TE_CORE_PKG"
          pip install --no-deps "$TE_CORE_PKG" 2>&1

          if [ "$TE_SPLIT_LAYOUT" = "1" ]; then
            TE_TORCH_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_torch*.tar.gz' | sort | head -n 1)
            TE_JAX_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_jax*.tar.gz' | sort | head -n 1)
          else
            TE_TORCH_PKG=""
            TE_JAX_PKG=""
          fi

          if [ -n "$TE_TORCH_PKG$TE_JAX_PKG" ]; then
            pip install ninja pybind11[global] 2>&1
          fi

          install_if_present "$TE_TORCH_PKG" "PyTorch"
          install_if_present "$TE_JAX_PKG" "JAX"
          EOF
          )"

      - name: Run sGPU tests in parallel (pytorch, jax, examples, core)
        id: run-tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -f FAIL_*

          docker exec \
            -e TEST_SGPU=1 \
            -e TEST_LEVEL=${{ env.TEST_LEVEL }} \
            -e HF_TOKEN="$HF_TOKEN" \
            te-runner bash -c "$(cat <<'EOF'
          #!/usr/bin/bash
          set -x -o pipefail
          ulimit -c 0 # Disable core dumps

          HIP_VISIBLE_DEVICES=0 ci/pytorch.sh > /workspace/torch.log 2>&1 &
          TORCH_PID=$!

          HIP_VISIBLE_DEVICES=1 ci/jax.sh > /workspace/jax.log 2>&1 &
          JAX_PID=$!

          (
            set -e
            python -c "import os; print('HF_TOKEN set:', bool(os.environ.get('HF_TOKEN')))"

            JAX_CONSTRAINTS=/tmp/jax-constraints.txt
            pip freeze | grep -iE '^(jax|jaxlib|jax[_-]rocm|jax[_-]plugins)[=@]' > "$JAX_CONSTRAINTS" || true

            export HIP_VISIBLE_DEVICES=2

            cd /workspace/examples/pytorch/mnist
            python main.py
            python main.py --use-te
            python main.py --use-fp8

            cd /workspace/examples/jax/mnist
            pip3 install -c "$JAX_CONSTRAINTS" -r requirements.txt
            python test_single_gpu_mnist.py
            python test_single_gpu_mnist.py --use-te
            python test_single_gpu_mnist.py --use-fp8

            cd /workspace/examples/jax/encoder
            pip3 install -c "$JAX_CONSTRAINTS" -r requirements.txt
            python test_single_gpu_encoder.py
            python test_single_gpu_encoder.py --use-fp8
          ) > /workspace/examples.log 2>&1 &
          EXAMPLES_PID=$!

          HIP_VISIBLE_DEVICES=3 ci/core.sh > /workspace/core.log 2>&1 &
          CORE_PID=$!

          wait $TORCH_PID;    torch_rc=$?
          wait $JAX_PID;      jax_rc=$?
          wait $EXAMPLES_PID; examples_rc=$?
          wait $CORE_PID;     core_rc=$?

          if [ $torch_rc -ne 0 ]; then
            echo "::group::[FAILED] PyTorch Log"
            cat /workspace/torch.log
            echo "::endgroup::"
            echo "::error::PyTorch tests FAILED."
            touch /workspace/FAIL_TORCH
          fi

          if [ $jax_rc -ne 0 ]; then
            echo "::group::[FAILED] JAX Log"
            cat /workspace/jax.log
            echo "::endgroup::"
            echo "::error::JAX tests FAILED."
            touch /workspace/FAIL_JAX
          fi

          if [ $examples_rc -ne 0 ]; then
            echo "::group::[FAILED] Examples Log"
            cat /workspace/examples.log
            echo "::endgroup::"
            echo "::error::Examples FAILED."
            touch /workspace/FAIL_EXAMPLES
          fi

          if [ $core_rc -ne 0 ]; then
            echo "::group::[FAILED] Core Log"
            cat /workspace/core.log
            echo "::endgroup::"
            echo "::error::Core tests FAILED."
            touch /workspace/FAIL_CORE
          fi

          test $torch_rc -eq 0 -a $jax_rc -eq 0 -a $examples_rc -eq 0 -a $core_rc -eq 0
          EOF
          )"

      - name: Check suite failure status
        if: always()
        run: |
          EXIT_STATUS=0
          if [[ -f FAIL_TORCH ]]; then
            echo "::error::PyTorch tests failed."
            EXIT_STATUS=1
          fi
          if [[ -f FAIL_JAX ]]; then
            echo "::error::JAX tests failed."
            EXIT_STATUS=1
          fi
          if [[ -f FAIL_EXAMPLES ]]; then
            echo "::error::Examples failed."
            EXIT_STATUS=1
          fi
          if [[ -f FAIL_CORE ]]; then
            echo "::error::Core tests failed."
            EXIT_STATUS=1
          fi
          exit $EXIT_STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-sgpu-${{ matrix.arch_label }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Cleanup container
        if: always()
        run: docker rm -f te-runner || true

  mgpu_tests:
    name: mGPU Tests (${{ matrix.arch_label }})
    needs: [select_image, build]
    timeout-minutes: 360
    runs-on: ${{ matrix.arch_label == 'mi30x' && 'linux-te-mi30x-8' || 'linux-te-mi35x-8' }}
    strategy:
      fail-fast: false
      matrix:
        arch_label: [mi30x, mi35x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Host Diagnostics
        run: |
          echo "::group::Host Diagnostics"
          echo ">>> GPU info:"
          ls -l /dev/dri
          ls -l /dev/kfd
          rocm-smi
          echo "::endgroup::"

      - name: Pull Docker Image
        run: |
          docker pull ${{ needs.select_image.outputs.image-tag }}

      - name: Run Container
        run: |
          docker run -dt \
            --rm \
            --name te-runner \
            --network=host \
            --device=/dev/dri --device=/dev/kfd \
            --shm-size=16G \
            --pid=host \
            --group-add $(getent group render | cut -d: -f3) \
            --group-add $(getent group video | cut -d: -f3) \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ needs.select_image.outputs.image-tag }}

      - name: Install packages
        run: |
          docker exec te-runner bash -c "$(cat <<'EOF'
          set -ex

          install_if_present() {
            pkg="$1"
            label="$2"
            if [ -n "$pkg" ]; then
              echo "Installing $label package: $pkg"
              pip install --no-build-isolation --no-deps "$pkg" 2>&1
            else
              echo "No $label package found; using the monolithic wheel layout."
            fi
          }

          TE_CORE_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm[0-9]*.whl' | sort | head -n 1)
          TE_SPLIT_LAYOUT=1
          if [ -z "$TE_CORE_PKG" ]; then
            TE_CORE_PKG=$(find /workspace/dist -type f -name 'transformer_engine-[0-9]*.whl' | sort | head -n 1)
            TE_SPLIT_LAYOUT=0
          fi
          test -n "$TE_CORE_PKG"
          pip install --no-deps "$TE_CORE_PKG" 2>&1

          if [ "$TE_SPLIT_LAYOUT" = "1" ]; then
            TE_TORCH_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_torch*.tar.gz' | sort | head -n 1)
            TE_JAX_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_jax*.tar.gz' | sort | head -n 1)
          else
            TE_TORCH_PKG=""
            TE_JAX_PKG=""
          fi

          if [ -n "$TE_TORCH_PKG$TE_JAX_PKG" ]; then
            pip install ninja pybind11[global] 2>&1
          fi

          install_if_present "$TE_TORCH_PKG" "PyTorch"
          install_if_present "$TE_JAX_PKG" "JAX"
          EOF
          )"

      - name: Run mGPU tests
        id: mgpu-tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -f FAIL_*

          docker exec \
            -e TEST_MGPU=1 \
            -e TEST_LEVEL=${{ env.TEST_LEVEL }} \
            -e HF_TOKEN="$HF_TOKEN" \
            te-runner bash -c "$(cat <<'EOF'
          #!/usr/bin/bash
          set -x -o pipefail
          ulimit -c 0 # Disable core dumps

          ci/pytorch.sh > /workspace/torch_mgpu.log 2>&1
          torch_rc=$?

          ci/jax.sh > /workspace/jax_mgpu.log 2>&1
          jax_rc=$?

          if [ $torch_rc -ne 0 ]; then
            echo "::group::[FAILED] PyTorch mGPU Log"
            cat /workspace/torch_mgpu.log
            echo "::endgroup::"
            echo "::error::PyTorch mGPU tests FAILED."
            touch /workspace/FAIL_TORCH_MGPU
          fi

          if [ $jax_rc -ne 0 ]; then
            echo "::group::[FAILED] JAX mGPU Log"
            cat /workspace/jax_mgpu.log
            echo "::endgroup::"
            echo "::error::JAX mGPU tests FAILED."
            touch /workspace/FAIL_JAX_MGPU
          fi

          test $torch_rc -eq 0 -a $jax_rc -eq 0
          EOF
          )"

      - name: Check mGPU failure status
        if: always()
        run: |
          EXIT_STATUS=0
          if [[ -f FAIL_TORCH_MGPU ]]; then
            echo "::error::PyTorch mGPU tests failed."
            EXIT_STATUS=1
          fi
          if [[ -f FAIL_JAX_MGPU ]]; then
            echo "::error::JAX mGPU tests failed."
            EXIT_STATUS=1
          fi
          exit $EXIT_STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-mgpu-${{ matrix.arch_label }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Cleanup container
        if: always()
        run: docker rm -f te-runner || true

  check_results:
    name: CI Result
    if: always()
    needs: [build, sgpu_tests, mgpu_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "Build:      ${{ needs.build.result }}"
          echo "sGPU Tests: ${{ needs.sgpu_tests.result }}"
          echo "mGPU Tests: ${{ needs.mgpu_tests.result }}"

          if [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.sgpu_tests.result }}" != "success" ]] || \
             [[ "${{ needs.mgpu_tests.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs did not succeed."
            exit 1
          fi
