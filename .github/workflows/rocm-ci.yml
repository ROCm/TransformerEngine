name: Build and Test Branch
run-name: CI Level ${{ (github.event_name == 'push' && '3') || inputs.test_level || '1' }}

on:
  push:
    branches:
      - 'dev'
      - 'release_v2.*_rocm'
  workflow_call:
    inputs:
      test_level:
        description: 'Test Level (1-3)'
        required: false
        default: '1'
        type: string
      docker_image_override:
        description: 'Manual Docker Image (Leave empty to use config file value)'
        required: false
        type: string
      test_config_from_source:
        description: 'DEBUG: Use config.json from current source branch instead of dev'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test Level (1-3)'
        required: true
        default: '1'
      docker_image_override:
        description: 'Manual Docker Image (Leave empty to use config file value)'
        required: false
        type: string
      test_config_from_source:
        description: 'DEBUG: Use config.json from current source branch instead of dev'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_LEVEL: ${{ (github.event_name == 'push' && '3') || inputs.test_level || '1' }}

jobs:
  select_image:
    name: Select Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image-tag: ${{ steps.select-image.outputs.image-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.test_config_from_source && github.ref_name || github.event.repository.default_branch || 'dev' }}
          sparse-checkout: ci/ci_config.json
          sparse-checkout-cone-mode: false

      - name: Select Docker Image Tag
        id: select-image
        run: |
          if [[ "${{ inputs.test_config_from_source }}" == "true" ]]; then
             echo "::notice::Debugging mode: Using ci/ci_config.json from ${{ github.ref_name }}"
          else
             echo "::notice::Using ci/ci_config.json from ${{ github.event.repository.default_branch || 'dev' }}"
          fi

          if [[ ! -f "ci/ci_config.json" ]]; then
             echo "::error::Config file not found in checkout."
             exit 1
          fi

          BRANCH_NAME="${{ github.base_ref || github.ref_name }}"
          echo "Determining image for branch: $BRANCH_NAME"
          VERSION_KEY="$BRANCH_NAME"

          if jq -e --arg key "$VERSION_KEY" '.docker_images[$key]' ci/ci_config.json > /dev/null; then
            JSON_KEY="$VERSION_KEY"
          else
            JSON_KEY="default"
          fi

          echo "Selected config key: $JSON_KEY"
          IMAGE_BASE=$(jq -r --arg key "$JSON_KEY" '.docker_images[$key]' ci/ci_config.json)

          MANUAL_OVERRIDE="${{ inputs.docker_image_override }}"
          if [[ -n "$MANUAL_OVERRIDE" ]]; then
            echo "::notice::Manual override detected: $MANUAL_OVERRIDE"
          fi

          echo "Selected base image tag: $IMAGE_BASE"
          echo "image-tag=$IMAGE_BASE" >> $GITHUB_OUTPUT

  # Which suites this run needs. Pull requests are gated by the paths they
  # change (ci/change_scope.py); everything else -- pushes to dev and release
  # branches, manual runs -- runs every suite, as does a PR labelled ci-skip-scope.
  # The rules are read from the PR's base branch, not from the PR, so a PR
  # cannot change the rules that gate it: a PR editing ci/change_scope.py is
  # judged by the reviewed copy, which sends any ci/ change to every suite.
  scope:
    name: Select Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_build: ${{ steps.scope.outputs.run_build }}
      sgpu_suites: ${{ steps.scope.outputs.sgpu_suites }}
      mgpu_suites: ${{ steps.scope.outputs.mgpu_suites }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # A PR is diffed against its base branch, which needs the history
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Select suites
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          SKIP_SCOPE: ${{ contains(github.event.pull_request.labels.*.name, 'ci-skip-scope') }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RULES_FROM_SOURCE: ${{ inputs.test_config_from_source }}
        run: |
          # Selecting every suite does not consult the rules, so this checkout's
          # own copy of the script serves for it.
          everything() {
            python3 ci/change_scope.py --all "$1" \
              --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          }

          if [[ "$EVENT" != "pull_request" ]]; then
            everything "${EVENT} runs are not gated"
            exit 0
          fi
          if [[ "$SKIP_SCOPE" == "true" ]]; then
            everything "the PR is labelled ci-skip-scope"
            exit 0
          fi

          # The base branch's copy of the rules; the PR's own only when asked
          # to debug it (test_config_from_source, as for ci_config.json).
          RULES=/tmp/change_scope.py
          if [[ "$RULES_FROM_SOURCE" == "true" ]]; then
            echo "::notice::Debugging mode: using ci/change_scope.py from the PR"
            cp ci/change_scope.py "$RULES"
          elif ! git show "origin/${BASE_REF}:ci/change_scope.py" > "$RULES" 2>/dev/null; then
            everything "${BASE_REF} has no ci/change_scope.py yet"
            exit 0
          fi

          # The whole PR against its merge base, not just the latest push.
          # --no-renames lists a moved file at both its old and its new path.
          if ! git diff --name-status --no-renames "${BASE_SHA}...${HEAD_SHA}" > /tmp/changed.txt; then
            echo "::warning::could not list the PR's changes; running every suite"
            everything "the PR's changes could not be listed"
            exit 0
          fi
          if ! python3 "$RULES" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" \
                < /tmp/changed.txt; then
            echo "::warning::ci/change_scope.py failed; running every suite"
            everything "the gating rules failed"
          fi

  build:
    needs: scope
    if: needs.scope.outputs.run_build == 'true'
    # Delegate wheel building to the reusable workflow on dev. It produces a core .whl plus framework .tar.gz sdists under artifact name `te-rocm-wheels`.
    uses: ./.github/workflows/rocm-wheels-build.yml
    secrets: inherit

  sgpu_tests:
    name: sGPU Tests (${{ matrix.arch_label }})
    needs: [scope, select_image, build]
    if: needs.scope.outputs.sgpu_suites != ''
    timeout-minutes: 270
    runs-on: ${{ matrix.arch_label == 'mi30x' && 'linux-te-mi30x-4' || matrix.arch_label == 'mi35x' && 'linux-te-mi35x-4' }}
    env:
      DOCKER_IMAGE: ${{ inputs.docker_image_override || needs.select_image.outputs.image-tag }}
    strategy:
      fail-fast: false
      matrix:
        arch_label: [mi30x, mi35x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize required submodules
        run: |
          git submodule update --init --recursive --depth 1 \
            3rdparty/googletest \
            3rdparty/hipify_torch \
            3rdparty/composable_kernel

      - name: Host Diagnostics
        run: |
          echo "::group::Host Diagnostics"
          echo ">>> GPU info:"
          ls -l /dev/dri
          ls -l /dev/kfd
          rocm-smi
          echo "::endgroup::"

      # Download artifacts and pull the Docker image concurrently
      - parallel:
          - name: Download build artifacts
            uses: actions/download-artifact@v8
            with:
              name: te-rocm-wheels
              path: dist/

          - name: Pull Docker Image
            run: |
              docker pull ${{ env.DOCKER_IMAGE }}

      - &run_container
        name: Run Container
        run: |
          DEVICE_FLAG="$(cat /etc/podinfo/gha-render-devices 2>/dev/null || echo --device=/dev/dri)"
          test -n "$DEVICE_FLAG"
          echo "Using device flag: $DEVICE_FLAG"
          docker run -dt \
            --rm \
            --name te-runner \
            --network=host \
            --device=/dev/kfd $DEVICE_FLAG \
            --shm-size=16G \
            --pid=host \
            --group-add $(getent group render | cut -d: -f3) \
            --group-add $(getent group video | cut -d: -f3) \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ env.DOCKER_IMAGE }}

      - name: Install packages
        run: |
          docker exec te-runner bash -c "$(cat <<'EOF'
          set -ex
          # core (cpp) tests build via cmake inside the repo; allow git ops in-tree.
          git config --global --add safe.directory '*'

          TE_CORE_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm[0-9]*.whl' | sort | head -n 1)
          TE_TORCH_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_torch*.tar.gz' | sort | head -n 1)
          TE_JAX_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_jax*.tar.gz' | sort | head -n 1)
          test -n "$TE_CORE_PKG" && test -n "$TE_TORCH_PKG" && test -n "$TE_JAX_PKG"

          pip install --no-deps "$TE_CORE_PKG"
          pip install ninja pybind11[global]
          pip install --upgrade hypothesis setuptools
          pip install --no-build-isolation --no-deps "$TE_TORCH_PKG"
          pip install --no-build-isolation --no-deps "$TE_JAX_PKG"
          EOF
          )"

      - name: Restore learned test weights
        uses: actions/cache/restore@v4
        with:
          path: ci-weights
          key: te-sgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-sgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-

      # What failed on an earlier attempt of *this* run. The restore key is
      # anchored to run_id, so it can only match an earlier attempt of the same
      # run -- a first attempt finds nothing and the queue runs in full. That is
      # the whole trigger: "Re-run failed jobs" already picks which jobs come
      # back, and the presence of this file is what tells the scheduler why.
      - name: Restore the previous attempt's failed items
        uses: actions/cache/restore@v4
        with:
          path: ci-rerun
          key: te-sgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-sgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-

      - name: Run sGPU tests as one queue (pytorch, jax, examples, core)
        id: run-tests
        # Below the job's timeout-minutes so an overrun kills only this step;
        # the `if: always()` report + upload steps still run (artifacts survive).
        timeout-minutes: 240
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # One subdir per suite so PyTorch/JAX/Core get independent reports and
          # never collide on identically-named XML (e.g. test_sanity_import.auto.xml
          # exists in both the torch and jax suites and runs in parallel).
          rm -rf test-results

          mkdir -p ci-weights
          wc -l ci-weights/*.txt 2>/dev/null \
            || echo "no weight table restored; this run will be unordered"

          mkdir -p ci-rerun
          wc -l ci-rerun/sgpu/*.tsv 2>/dev/null \
            || echo "no failed-item list restored; this run queues every suite"
          # Present only for items the last attempt could narrow to single
          # tests; the rest of the failed list re-runs whole.
          wc -l ci-rerun/sgpu/tests/*.txt 2>/dev/null \
            || echo "no per-test lists restored; any queued item re-runs whole"

          docker exec \
            -e TEST_LEVEL=${{ env.TEST_LEVEL }} \
            -e JUNITXML_PREFIX=/workspace/test-results/ \
            -e JUNITXML_SUFFIX=.xml \
            -e HF_TOKEN="$HF_TOKEN" \
            -e GITHUB_ACTIONS \
            te-runner bash /workspace/ci/run_queue.sh --queue sgpu \
              --suites "${{ needs.scope.outputs.sgpu_suites }}" \
              --log-dir /workspace/test-results/logs

      - name: Save learned test weights
        if: always() && hashFiles('ci-weights/*') != ''
        uses: actions/cache/save@v4
        with:
          path: ci-weights
          key: te-sgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate test report
        if: always()
        env:
          ATTEMPT: ${{ github.run_attempt }}
          SUITES: ${{ needs.scope.outputs.sgpu_suites }}
        run: |
          command -v python3 >/dev/null 2>&1 || { echo "python3 not available; skipping report"; exit 0; }

          # Each attempt reports only what it ran, and nothing from an earlier
          # one is replayed here: GitHub keeps a summary per attempt and puts a
          # picker on the job page to move between them, so the full run's
          # results are a click away rather than lost.
          #
          # One report per suite; each appends its own section. An empty subdir
          # means the suite crashed before writing XML on a first attempt, or
          # simply was not re-queued on a later one -- junit_report.py tells the
          # two apart from --attempt and words the section accordingly.
          # A suite the PR's changes did not select has nothing to report; the
          # schedule report below names it as not selected.
          report() {
            [[ " $SUITES " == *" $1 "* ]] || return 0
            python3 ci/junit_report.py "test-results/$1" --title "$2" --attempt "$ATTEMPT"
          }
          report torch "sGPU PyTorch (${{ matrix.arch_label }})"
          report jax "sGPU JAX (${{ matrix.arch_label }})"
          report core "sGPU Core (${{ matrix.arch_label }})"
          if [ -f test-results/logs/report/schedule.md ]; then
            cat test-results/logs/report/schedule.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no schedule.md -- the queue did not reach its report phase"
          fi

      # Saved under this attempt's number so the next one restores it by prefix.
      # Saved even when the queue passed: the file is then empty, and restoring
      # an empty list is what stops a third attempt re-running the second's work.
      - name: Save this attempt's failed items
        if: always() && hashFiles('ci-rerun/**') != ''
        uses: actions/cache/save@v4
        with:
          path: ci-rerun
          key: te-sgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check suite failure status
        if: always()
        run: |
          EXIT_STATUS=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue
            read -r label logfile rest <<< "$line"
            rc=$(cat "test-results/logs/suites/${logfile}.rc" 2>/dev/null || echo "missing")
            [[ "$rc" == "0" ]] && continue
            echo "::error::${label} tests FAILED (rc=${rc})."
            EXIT_STATUS=1
            for f in test-results/logs/items/"${label}".*.log; do
              [[ -e "$f" ]] || continue
              irc=$(cat "${f}.rc" 2>/dev/null || echo 1)
              [[ "$irc" == "0" ]] && continue
              echo "::group::[FAILED] $(basename "$f" .log) (rc=${irc})"
              cat "$f"
              echo "::endgroup::"
            done
          done < ci/ci_sgpu_queue.conf
          exit $EXIT_STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-sgpu-${{ matrix.arch_label }}
          path: |
            test-results/**
            ci-weights/*.txt
            ci-rerun/sgpu/**
          if-no-files-found: ignore
          retention-days: 5
          # A re-run uploads under a name the first attempt already used, which
          # v4 rejects as a duplicate. Replace it: the logs of the attempt being
          # re-run are the ones nobody wants.
          overwrite: true

      - name: Cleanup container
        if: always()
        run: docker rm -f te-runner || true

  # PyTorch and JAX multi-GPU tests share one 8-GPU runner as a single queue.
  # Each item runs on the GPUs its call site declares (TE_CI_GPUS in
  # ci/pytorch.sh and ci/jax.sh) or on the whole box, and items that fit side by
  # side share it -- see ci/run_queue.sh.
  mgpu_tests:
    name: mGPU Tests (${{ matrix.arch_label }})
    needs: [scope, select_image, build]
    if: needs.scope.outputs.mgpu_suites != ''
    timeout-minutes: 210
    runs-on: ${{ matrix.arch_label == 'mi30x' && 'linux-te-mi30x-8' || matrix.arch_label == 'mi35x' && 'linux-te-mi35x-8' }}
    env:
      DOCKER_IMAGE: ${{ inputs.docker_image_override || needs.select_image.outputs.image-tag }}
    strategy:
      fail-fast: false
      matrix:
        arch_label: [mi30x, mi35x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Host Diagnostics
        run: |
          echo "::group::Host Diagnostics"
          echo ">>> GPU info:"
          ls -l /dev/dri
          ls -l /dev/kfd
          rocm-smi
          echo "::endgroup::"

      # Download artifacts and pull the Docker image concurrently
      - parallel:
          - name: Download build artifacts
            uses: actions/download-artifact@v8
            with:
              name: te-rocm-wheels
              path: dist/

          - name: Pull Docker Image
            run: |
              docker pull ${{ env.DOCKER_IMAGE }}

      - *run_container

      - name: Install packages
        run: |
          docker exec te-runner bash -c "$(cat <<'EOF'
          set -ex

          TE_CORE_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm[0-9]*.whl' | sort | head -n 1)
          TE_TORCH_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_torch*.tar.gz' | sort | head -n 1)
          TE_JAX_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_jax*.tar.gz' | sort | head -n 1)
          test -n "$TE_CORE_PKG" && test -n "$TE_TORCH_PKG" && test -n "$TE_JAX_PKG"

          pip install --no-deps "$TE_CORE_PKG"
          pip install ninja pybind11[global]
          pip install --upgrade hypothesis setuptools
          pip install --no-build-isolation --no-deps "$TE_TORCH_PKG"
          pip install --no-build-isolation --no-deps "$TE_JAX_PKG"
          EOF
          )"

      - name: Restore learned test weights
        uses: actions/cache/restore@v4
        with:
          path: ci-weights
          key: te-mgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-mgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-

      # What failed on an earlier attempt of *this* run; see the sGPU job.
      - name: Restore the previous attempt's failed items
        uses: actions/cache/restore@v4
        with:
          path: ci-rerun
          key: te-mgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-mgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-

      - name: Run mGPU tests as one queue (pytorch, jax)
        id: run-tests
        # Below the job's timeout-minutes so an overrun kills only this step;
        # the `if: always()` report + upload steps still run (artifacts survive).
        timeout-minutes: 180
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf test-results

          mkdir -p ci-weights
          wc -l ci-weights/*.txt 2>/dev/null \
            || echo "no weight table restored; this run will be unordered"

          mkdir -p ci-rerun
          wc -l ci-rerun/mgpu/*.tsv 2>/dev/null \
            || echo "no failed-item list restored; this run queues every suite"
          wc -l ci-rerun/mgpu/tests/*.txt 2>/dev/null \
            || echo "no per-test lists restored; any queued item re-runs whole"

          docker exec \
            -e TEST_LEVEL=${{ env.TEST_LEVEL }} \
            -e JUNITXML_PREFIX=/workspace/test-results/ \
            -e JUNITXML_SUFFIX=.xml \
            -e HF_TOKEN="$HF_TOKEN" \
            -e GITHUB_ACTIONS \
            -e TE_CI_SUITES="${{ needs.scope.outputs.mgpu_suites }}" \
            te-runner bash -c "ulimit -c 0; exec bash /workspace/ci/run_queue.sh --queue mgpu \
              --log-dir /workspace/test-results/logs"

      - name: Save learned test weights
        if: always() && hashFiles('ci-weights/*') != ''
        uses: actions/cache/save@v4
        with:
          path: ci-weights
          key: te-mgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate test report
        if: always()
        env:
          ATTEMPT: ${{ github.run_attempt }}
          SUITES: ${{ needs.scope.outputs.mgpu_suites }}
        run: |
          command -v python3 >/dev/null 2>&1 || { echo "python3 not available; skipping report"; exit 0; }
          # A suite the PR's changes did not select has nothing to report; the
          # schedule report below names it as not selected.
          report() {
            [[ " $SUITES " == *" $1 "* ]] || return 0
            python3 ci/junit_report.py "test-results/$1" --title "$2" --attempt "$ATTEMPT"
          }
          report torch-mgpu "mGPU PyTorch (${{ matrix.arch_label }})"
          report jax-mgpu "mGPU JAX (${{ matrix.arch_label }})"
          if [ -f test-results/logs/report/schedule.md ]; then
            cat test-results/logs/report/schedule.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no schedule.md -- the queue did not reach its report phase"
          fi

      - name: Save this attempt's failed items
        if: always() && hashFiles('ci-rerun/**') != ''
        uses: actions/cache/save@v4
        with:
          path: ci-rerun
          key: te-mgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check suite failure status
        if: always()
        run: |
          EXIT_STATUS=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue
            read -r label logfile rest <<< "$line"
            rc=$(cat "test-results/logs/suites/${logfile}.rc" 2>/dev/null || echo "missing")
            [[ "$rc" == "0" ]] && continue
            echo "::error::${label} tests FAILED (rc=${rc})."
            EXIT_STATUS=1
            for f in test-results/logs/items/"${label}".*.log; do
              [[ -e "$f" ]] || continue
              irc=$(cat "${f}.rc" 2>/dev/null || echo 1)
              [[ "$irc" == "0" ]] && continue
              echo "::group::[FAILED] $(basename "$f" .log) (rc=${irc})"
              cat "$f"
              echo "::endgroup::"
            done
          done < ci/ci_mgpu_queue.conf
          exit $EXIT_STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-mgpu-${{ matrix.arch_label }}
          path: |
            test-results/**
            ci-weights/*.txt
            ci-rerun/mgpu/**
          if-no-files-found: ignore
          retention-days: 5
          overwrite: true

      - name: Cleanup container
        if: always()
        run: docker rm -f te-runner || true
