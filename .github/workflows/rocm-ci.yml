name: Build and Test Branch
run-name: CI Level ${{ (github.event_name == 'push' && '3') || inputs.test_level || '1' }}

on:
  push:
    branches:
      - 'dev'
      - 'release_v2.*_rocm'
  workflow_call:
    inputs:
      test_level:
        description: 'Test Level (1-3)'
        required: false
        default: '1'
        type: string
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test Level (1-3)'
        required: true
        default: '1'
      full_run:
        description: 'Full run: Runs the Build, and all test suites regardless of changes'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_LEVEL: ${{ (github.event_name == 'push' && '3') || inputs.test_level || '1' }}
  # CI runtime data, relative to the repo root: test-results/, plus weights/ and
  # rerun/ kept by actions/cache. ci/run_queue.sh reads the same variable.
  TE_CI_DATA_DIR: ci-data

jobs:
  # What this run builds and tests. A PR or a manual run runs only the suites its changed
  # paths affect (.github/scripts/change_scope.py, the run's own copy); a manual run's
  # changes are its branch's against dev. Runs on dev and release branches, and manual
  # runs with "full run", run every suite. Then it finds a TE build to reuse and checks
  # whether the Flash Attention wheel is published.
  scope:
    name: Plan Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      run_build: ${{ steps.scope.outputs.run_build }}
      build_key: ${{ steps.wheels.outputs.build_key }}
      wheels_run_id: ${{ steps.wheels.outputs.run_id }}
      flash_attn_build: ${{ steps.flash_attn.outputs.build }}
      sgpu_suites: ${{ steps.scope.outputs.sgpu_suites }}
      mgpu_suites: ${{ steps.scope.outputs.mgpu_suites }}
      emu_suites: ${{ steps.scope.outputs.emu_suites }}
      # "Re-run failed jobs" copies this job and its outputs from the earlier
      # attempt; "Re-run all jobs" runs it again. The GPU jobs tell the two apart
      # by comparing this with the current attempt.
      ran_in_attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # A PR is diffed against its base branch and a manual run against dev, which
          # needs the history
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && '0' || '1' }}

      - name: Select suites
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FULL_RUN: ${{ inputs.full_run }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          everything() {
            python3 .github/scripts/change_scope.py --all "$1" \
              --github-output "$GITHUB_OUTPUT" --summary "$RUNNER_TEMP/summary-tests.md"
          }

          if [[ "$EVENT" == "pull_request" ]]; then
            # The whole PR against its merge base, not just the latest push
            range="${BASE_SHA}...${HEAD_SHA}"
          elif [[ "$REF_NAME" == dev || "$REF_NAME" == release_* ]]; then
            everything "runs on dev and release branches are not gated"
            exit 0
          elif [[ "$FULL_RUN" == true ]]; then
            everything "this manual run is a full run"
            exit 0
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            # The branch's changes against dev
            range="origin/dev...HEAD"
          else
            everything "${EVENT} runs are not gated"
            exit 0
          fi

          # --no-renames lists a moved file at both its old and its new path.
          if ! git diff --name-status --no-renames "$range" > /tmp/changed.txt; then
            echo "::warning::could not list the changes; running every suite"
            everything "the changes could not be listed"
            exit 0
          fi
          if ! python3 .github/scripts/change_scope.py --github-output "$GITHUB_OUTPUT" \
                --summary "$RUNNER_TEMP/summary-tests.md" < /tmp/changed.txt; then
            echo "::warning::.github/scripts/change_scope.py failed; running every suite"
            everything "the gating rules failed"
          fi

      # The TE wheels this run reuses: an earlier build of the same files (the build key,
      # BUILD_RULES in .github/scripts/change_scope.py) from this PR's or branch's own
      # runs, or from the branch a PR targets (dev for a manual run). Runs on dev and
      # release branches, and manual runs with "full run", always build.
      - name: Find a TE build to reuse
        id: wheels
        if: steps.scope.outputs.run_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          REPO_ID: ${{ github.repository_id }}
          FULL_RUN: ${{ inputs.full_run }}
        run: |
          key=$(python3 .github/scripts/change_scope.py --build-key | cut -d= -f2)
          echo "build_key=$key" >> "$GITHUB_OUTPUT"
          own=""
          if [[ "$EVENT" == pull_request ]]; then
            own_repo=$HEAD_REPO_ID own=$HEAD_REF base=$BASE_REF
          elif [[ "$REF_NAME" == dev || "$REF_NAME" == release_* ]]; then
            msg="Building; runs on dev and release branches always build"
          elif [[ "$FULL_RUN" == true ]]; then
            msg="Building; this manual run is a full run"
          else
            own_repo=$REPO_ID own=$REF_NAME base=dev
          fi
          run=""
          if [[ -n "$own" ]]; then
            # The latest one, as: run ID, branch, commit
            if ! found=$(set -o pipefail
                gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=te-rocm-wheels-$key&per_page=100" \
                | jq -r --argjson own_repo "$own_repo" --arg own "$own" --argjson repo "$REPO_ID" --arg base "$base" '
                    [.artifacts[] | select(.expired | not) | select(.workflow_run as $r
                      | ($r.head_repository_id == $own_repo and $r.head_branch == $own)
                        or ($r.head_repository_id == $repo and $r.head_branch == $base))]
                    | sort_by(.created_at) | last // empty
                    | [.workflow_run.id, .workflow_run.head_branch, .workflow_run.head_sha[:9]] | @tsv'); then
              echo "::warning::Couldn't list the earlier TE builds; this run builds TE"
              msg="Couldn't list the earlier builds; building"
            elif [[ -n "$found" ]]; then
              IFS=$'\t' read -r run branch sha <<< "$found"
              msg="Found \`te-rocm-wheels-$key\` in [run $run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run) ($branch, $sha); reusing it"
            else
              msg="No \`te-rocm-wheels-$key\` found in the runs on $own or $base; building"
            fi
          fi
          echo "run_id=$run" >> "$GITHUB_OUTPUT"
          echo "TE: $msg"
          echo "- **TE:** $msg" >> "$RUNNER_TEMP/summary-build.md"

      # Whether the Flash Attention wheel the torch suites install is published on
      # ghcr.io, so a build runner starts only when it has to be built
      - name: Check the Flash Attention wheel
        id: flash_attn
        if: steps.scope.outputs.run_build == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          ref=$(ci/deps/build_fa_wheel.sh --ref)
          rc=0
          ci/deps/build_fa_wheel.sh --check || rc=$?
          if [[ $rc == 0 ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            msg="Found the wheel at \`$ref\`"
          else
            # Missing, or not known: the Flash Attention job checks again and builds it
            echo "build=true" >> "$GITHUB_OUTPUT"
            msg="No wheel found at \`$ref\`; building it"
          fi
          echo "Flash Attention: $msg"
          echo "- **Flash Attention:** $msg" >> "$RUNNER_TEMP/summary-build.md"

      # The job summary: what the build steps found, then the test suites
      - name: Write the job summary
        if: always()
        run: |
          {
            if [[ -s "$RUNNER_TEMP/summary-build.md" ]]; then
              printf '## Build\n\n'
              cat "$RUNNER_TEMP/summary-build.md"
              echo
            fi
            if [[ -s "$RUNNER_TEMP/summary-tests.md" ]]; then
              printf '## Test suites\n\n'
              cat "$RUNNER_TEMP/summary-tests.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: scope
    if: needs.scope.outputs.run_build == 'true' && needs.scope.outputs.wheels_run_id == ''
    permissions:
      contents: read
    # Delegate wheel building to the reusable workflow. It produces a core .whl plus framework .tar.gz sdists, named by the build key so later runs can reuse them.
    uses: ./.github/workflows/rocm-wheels-build.yml
    secrets: inherit
    with:
      artifact_name: te-rocm-wheels-${{ needs.scope.outputs.build_key }}
      use_ccache: true
      save_ccache: ${{ github.event_name != 'pull_request' }}

  # Builds and publishes the Flash Attention wheel the torch suites install, when the
  # scope job found this branch's torch, ROCm or Python has none yet
  flash_attn:
    name: Flash Attention wheel
    needs: scope
    if: needs.scope.outputs.flash_attn_build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/fa-wheel-publish.yml

  sgpu_tests:
    name: sGPU Tests (${{ matrix.arch_label }})
    needs: [scope, build, flash_attn]
    # build is skipped when an earlier build is reused, flash_attn when the wheel is published
    if: >-
      !cancelled()
      && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.scope.outputs.wheels_run_id != ''))
      && contains(fromJSON('["success", "skipped"]'), needs.flash_attn.result)
      && needs.scope.outputs.sgpu_suites != ''
    permissions:
      contents: read
      packages: read
      actions: read
    timeout-minutes: 270
    runs-on: ${{ matrix.arch_label == 'mi30x' && 'linux-te-mi30x-4' || matrix.arch_label == 'mi35x' && 'linux-te-mi35x-4' }}
    env:
      SUITES: ${{ needs.scope.outputs.sgpu_suites }}
      GPU_ARCH: ${{ matrix.arch_label == 'mi30x' && 'gfx942' || 'gfx950' }}
    strategy:
      fail-fast: false
      matrix:
        arch_label: [mi30x, mi35x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize required submodules
        run: |
          git submodule update --init --recursive --depth 1 \
            3rdparty/googletest \
            3rdparty/hipify_torch \
            3rdparty/composable_kernel

      - name: Host Diagnostics
        run: |
          echo "::group::Host Diagnostics"
          echo ">>> GPU info:"
          ls -l /dev/dri
          ls -l /dev/kfd
          rocm-smi
          echo "::endgroup::"

      # Download artifacts and set up the test container concurrently
      - parallel:
          - name: Download build artifacts
            uses: actions/download-artifact@v8
            with:
              name: te-rocm-wheels-${{ needs.scope.outputs.build_key }}
              path: dist/
              # A reused build is in an earlier run
              github-token: ${{ needs.scope.outputs.wheels_run_id && github.token || '' }}
              run-id: ${{ needs.scope.outputs.wheels_run_id || github.run_id }}

          - &start_container
            name: Start container
            env:
              # Reads the Flash Attention wheel while its ghcr.io package is private
              GHCR_TOKEN: ${{ github.token }}
            run: |
              DEVICE_FLAG="$(cat /etc/podinfo/gha-render-devices 2>/dev/null || echo --device=/dev/dri)"
              test -n "$DEVICE_FLAG"
              echo "Using device flag: $DEVICE_FLAG"
              # A plain OS image: install_deps.sh installs each framework the job's suites
              # use into its own venv, for this runner's GPU arch; each suite runs in its own.
              FRAMEWORKS=""
              for suite in $SUITES; do
                case "$suite" in
                  torch|torch-mgpu|core) FRAMEWORKS="$FRAMEWORKS torch" ;;
                  jax|jax-mgpu) FRAMEWORKS="$FRAMEWORKS jax" ;;
                  *) FRAMEWORKS="$FRAMEWORKS torch jax" ;;
                esac
              done
              FRAMEWORKS=$(printf '%s\n' $FRAMEWORKS | sort -ur | xargs)
              VENV_ENV=()
              for fw in $FRAMEWORKS; do
                VENV_ENV+=(-e "TE_CI_${fw^^}_VENV=/opt/venv-$fw")
              done
              # The queue's own Python (GPU probes, CK JIT prebuild) runs in the first venv:
              # torch when the job has it
              DEFAULT_VENV=/opt/venv-${FRAMEWORKS%% *}
              TE_CI_BASE_IMAGE=$(sed -n 's/^base-image = "\(.*\)"$/\1/p' ci/deps/pyproject.toml)
              SECONDS=0
              docker pull "$TE_CI_BASE_IMAGE"
              docker run -dt \
                --rm \
                --name te-runner \
                --network=host \
                --device=/dev/kfd $DEVICE_FLAG \
                --shm-size=16G \
                --pid=host \
                --group-add $(getent group render | cut -d: -f3) \
                --group-add $(getent group video | cut -d: -f3) \
                "${VENV_ENV[@]}" \
                -e VIRTUAL_ENV=$DEFAULT_VENV \
                -e PATH=$DEFAULT_VENV/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                -v "${{ github.workspace }}:/workspace" \
                -w /workspace \
                "$TE_CI_BASE_IMAGE"
              for fw in $FRAMEWORKS; do
                docker exec -e GHCR_TOKEN -e GITHUB_ACTOR \
                  te-runner bash ci/install_deps.sh "$GPU_ARCH" --frameworks "$fw"
              done
              echo "Test environment ready in ${SECONDS} s"

      - &install_packages
        name: Install packages
        run: |
          docker exec te-runner bash -c "$(cat <<'EOF'
          set -ex
          # core (cpp) tests build via cmake inside the repo; allow git ops in-tree.
          git config --global --add safe.directory '*'

          TE_CORE_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm[0-9]*.whl' | sort | head -n 1)
          TE_TORCH_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_torch*.tar.gz' | sort | head -n 1)
          TE_JAX_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_jax*.tar.gz' | sort | head -n 1)
          test -n "$TE_CORE_PKG" && test -n "$TE_TORCH_PKG" && test -n "$TE_JAX_PKG"

          # Each framework venv the job has gets the core wheel and its own package,
          # built with only that venv on PATH. The build tools are in the locks.
          if [ -n "${TE_CI_TORCH_VENV:-}" ]; then
            ( export VIRTUAL_ENV="$TE_CI_TORCH_VENV" PATH="$TE_CI_TORCH_VENV/bin:$PATH"
              pip install --no-deps "$TE_CORE_PKG"
              pip install --no-build-isolation --no-deps "$TE_TORCH_PKG" )
          fi
          if [ -n "${TE_CI_JAX_VENV:-}" ]; then
            ( export VIRTUAL_ENV="$TE_CI_JAX_VENV" PATH="$TE_CI_JAX_VENV/bin:$PATH"
              pip install --no-deps "$TE_CORE_PKG"
              pip install --no-build-isolation --no-deps "$TE_JAX_PKG" )
          fi
          EOF
          )"

      - name: Restore learned test weights
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/weights
          key: te-sgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-sgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-

      # What failed on an earlier attempt of this run, restored only on "Re-run
      # failed jobs" (the scope job was copied, not re-run). A first attempt and
      # "Re-run all jobs" run the whole queue.
      - name: Restore the previous attempt's failed items
        if: needs.scope.outputs.ran_in_attempt != github.run_attempt
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/rerun
          key: te-sgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-sgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-

      - name: Run sGPU tests as one queue (pytorch, jax, examples, core)
        id: run-tests
        # Below the job's timeout-minutes so an overrun kills only this step;
        # the `if: always()` report + upload steps still run (artifacts survive).
        timeout-minutes: 240
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # One subdir per suite so PyTorch/JAX/Core get independent reports and
          # never collide on identically-named XML (e.g. test_sanity_import.auto.xml
          # exists in both the torch and jax suites and runs in parallel).
          rm -rf "$TE_CI_DATA_DIR/test-results"

          mkdir -p "$TE_CI_DATA_DIR/weights"
          wc -l "$TE_CI_DATA_DIR"/weights/*.txt 2>/dev/null \
            || echo "no weight table restored; this run will be unordered"

          mkdir -p "$TE_CI_DATA_DIR/rerun"
          wc -l "$TE_CI_DATA_DIR"/rerun/sgpu/*.tsv 2>/dev/null \
            || echo "no failed-item list restored; this run queues every suite"
          # Present only for items the last attempt could narrow to single tests
          wc -l "$TE_CI_DATA_DIR"/rerun/sgpu/tests/*.txt 2>/dev/null \
            || echo "no per-test lists restored; any queued item re-runs whole"

          # No core dumps: a crashing test would leave a root-owned, mode 0600 GPU
          # core dump in the uploaded results, which fails the log upload.
          docker exec \
            -e TEST_LEVEL=${{ env.TEST_LEVEL }} \
            -e TE_CI_DATA_DIR \
            -e JUNITXML_PREFIX="/workspace/$TE_CI_DATA_DIR/test-results/" \
            -e JUNITXML_SUFFIX=.xml \
            -e HF_TOKEN="$HF_TOKEN" \
            -e GITHUB_ACTIONS \
            -e TE_CI_SUITES="${{ needs.scope.outputs.sgpu_suites }}" \
            te-runner bash -c "ulimit -c 0; exec bash /workspace/ci/run_queue.sh --queue sgpu \
              --log-dir /workspace/$TE_CI_DATA_DIR/test-results/logs"

      - name: Save learned test weights
        if: always() && hashFiles(format('{0}/weights/*', env.TE_CI_DATA_DIR)) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/weights
          key: te-sgpu-weights-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate test report
        if: always()
        env:
          ATTEMPT: ${{ github.run_attempt }}
          SUITES: ${{ needs.scope.outputs.sgpu_suites }}
        run: |
          # "Re-run failed jobs" copies passed jobs, summaries included, into the
          # new attempt, so say which attempt wrote this one
          echo "Results from attempt ${ATTEMPT} of this run." >> "$GITHUB_STEP_SUMMARY"
          command -v python3 >/dev/null 2>&1 || { echo "python3 not available; skipping report"; exit 0; }

          # One report per suite; each appends its own section to the job summary.
          # An attempt reports only what it ran (GitHub keeps a summary per
          # attempt). A suite a re-run skipped says so; any other empty suite dir is
          # reported as a crash. Unselected suites are named in the schedule.
          report() {
            [[ " $SUITES " == *" $1 "* ]] || return 0
            python3 ci/junit_report.py "$TE_CI_DATA_DIR/test-results/$1" --title "$2"
          }
          report torch "sGPU PyTorch (${{ matrix.arch_label }})"
          report jax "sGPU JAX (${{ matrix.arch_label }})"
          report examples "sGPU Examples (${{ matrix.arch_label }})"
          report core "sGPU Core (${{ matrix.arch_label }})"
          if [ -f "$TE_CI_DATA_DIR/test-results/logs/report/schedule.md" ]; then
            cat "$TE_CI_DATA_DIR/test-results/logs/report/schedule.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no schedule.md -- the queue did not reach its report phase"
          fi

      # Saved per attempt, even when empty, so the next attempt restores this
      # attempt's list rather than an older one.
      - name: Save this attempt's failed items
        if: always() && hashFiles(format('{0}/rerun/**', env.TE_CI_DATA_DIR)) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/rerun
          key: te-sgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check suite failure status
        if: always()
        run: |
          EXIT_STATUS=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue
            read -r label logfile rest <<< "$line"
            rc=$(cat "$TE_CI_DATA_DIR/test-results/logs/suites/${logfile}.rc" 2>/dev/null || echo "missing")
            [[ "$rc" == "0" ]] && continue
            echo "::error::${label} tests FAILED (rc=${rc})."
            EXIT_STATUS=1
            for f in "$TE_CI_DATA_DIR"/test-results/logs/items/"${label}".*.log; do
              [[ -e "$f" ]] || continue
              irc=$(cat "${f}.rc" 2>/dev/null || echo 1)
              [[ "$irc" == "0" ]] && continue
              echo "::group::[FAILED] $(basename "$f" .log) (rc=${irc})"
              cat "$f"
              echo "::endgroup::"
            done
          done < ci/ci_sgpu_queue.conf
          exit $EXIT_STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-sgpu-${{ matrix.arch_label }}
          path: ${{ env.TE_CI_DATA_DIR }}/**
          if-no-files-found: ignore
          retention-days: 5
          # A re-run uploads under the same name; replace the earlier attempt's logs
          overwrite: true

      - name: Cleanup container
        if: always()
        run: docker rm -f te-runner || true

  # PyTorch and JAX multi-GPU tests share one 8-GPU runner as a single queue.
  # Each item runs on the whole box, one after another -- see ci/run_queue.sh.
  mgpu_tests:
    name: mGPU Tests (${{ matrix.arch_label }})
    needs: [scope, build, flash_attn]
    # build is skipped when an earlier build is reused, flash_attn when the wheel is published
    if: >-
      !cancelled()
      && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.scope.outputs.wheels_run_id != ''))
      && contains(fromJSON('["success", "skipped"]'), needs.flash_attn.result)
      && needs.scope.outputs.mgpu_suites != ''
    permissions:
      contents: read
      packages: read
      actions: read
    timeout-minutes: 240
    runs-on: ${{ matrix.arch_label == 'mi30x' && 'linux-te-mi30x-8' || matrix.arch_label == 'mi35x' && 'linux-te-mi35x-8' }}
    env:
      SUITES: ${{ needs.scope.outputs.mgpu_suites }}
      GPU_ARCH: ${{ matrix.arch_label == 'mi30x' && 'gfx942' || 'gfx950' }}
    strategy:
      fail-fast: false
      matrix:
        arch_label: [mi30x, mi35x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Host Diagnostics
        run: |
          echo "::group::Host Diagnostics"
          echo ">>> GPU info:"
          ls -l /dev/dri
          ls -l /dev/kfd
          rocm-smi
          echo "::endgroup::"

      # Download artifacts and set up the test container concurrently
      - parallel:
          - name: Download build artifacts
            uses: actions/download-artifact@v8
            with:
              name: te-rocm-wheels-${{ needs.scope.outputs.build_key }}
              path: dist/
              # A reused build is in an earlier run
              github-token: ${{ needs.scope.outputs.wheels_run_id && github.token || '' }}
              run-id: ${{ needs.scope.outputs.wheels_run_id || github.run_id }}

          - *start_container

      - *install_packages

      # What failed on an earlier attempt of this run; see the sGPU job.
      - name: Restore the previous attempt's failed items
        if: needs.scope.outputs.ran_in_attempt != github.run_attempt
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/rerun
          key: te-mgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-mgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-

      - name: Run mGPU tests as one queue (pytorch, jax)
        id: run-tests
        # Below the job's timeout-minutes so an overrun kills only this step;
        # the `if: always()` report + upload steps still run (artifacts survive).
        timeout-minutes: 180
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf "$TE_CI_DATA_DIR/test-results"

          mkdir -p "$TE_CI_DATA_DIR/rerun"
          wc -l "$TE_CI_DATA_DIR"/rerun/mgpu/*.tsv 2>/dev/null \
            || echo "no failed-item list restored; this run queues every suite"
          wc -l "$TE_CI_DATA_DIR"/rerun/mgpu/tests/*.txt 2>/dev/null \
            || echo "no per-test lists restored; any queued item re-runs whole"

          docker exec \
            -e TEST_LEVEL=${{ env.TEST_LEVEL }} \
            -e TE_CI_DATA_DIR \
            -e JUNITXML_PREFIX="/workspace/$TE_CI_DATA_DIR/test-results/" \
            -e JUNITXML_SUFFIX=.xml \
            -e HF_TOKEN="$HF_TOKEN" \
            -e GITHUB_ACTIONS \
            -e TE_CI_SUITES="${{ needs.scope.outputs.mgpu_suites }}" \
            te-runner bash -c "ulimit -c 0; exec bash /workspace/ci/run_queue.sh --queue mgpu \
              --log-dir /workspace/$TE_CI_DATA_DIR/test-results/logs"

      - name: Generate test report
        if: always()
        env:
          ATTEMPT: ${{ github.run_attempt }}
          SUITES: ${{ needs.scope.outputs.mgpu_suites }}
        run: |
          # "Re-run failed jobs" copies passed jobs, summaries included, into the
          # new attempt, so say which attempt wrote this one
          echo "Results from attempt ${ATTEMPT} of this run." >> "$GITHUB_STEP_SUMMARY"
          command -v python3 >/dev/null 2>&1 || { echo "python3 not available; skipping report"; exit 0; }
          # Unselected suites have no report; the schedule report names them
          report() {
            [[ " $SUITES " == *" $1 "* ]] || return 0
            python3 ci/junit_report.py "$TE_CI_DATA_DIR/test-results/$1" --title "$2"
          }
          report torch-mgpu "mGPU PyTorch (${{ matrix.arch_label }})"
          report jax-mgpu "mGPU JAX (${{ matrix.arch_label }})"
          if [ -f "$TE_CI_DATA_DIR/test-results/logs/report/schedule.md" ]; then
            cat "$TE_CI_DATA_DIR/test-results/logs/report/schedule.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no schedule.md -- the queue did not reach its report phase"
          fi

      - name: Save this attempt's failed items
        if: always() && hashFiles(format('{0}/rerun/**', env.TE_CI_DATA_DIR)) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/rerun
          key: te-mgpu-rerun-${{ matrix.arch_label }}-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check suite failure status
        if: always()
        run: |
          EXIT_STATUS=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue
            read -r label logfile rest <<< "$line"
            rc=$(cat "$TE_CI_DATA_DIR/test-results/logs/suites/${logfile}.rc" 2>/dev/null || echo "missing")
            [[ "$rc" == "0" ]] && continue
            echo "::error::${label} tests FAILED (rc=${rc})."
            EXIT_STATUS=1
            for f in "$TE_CI_DATA_DIR"/test-results/logs/items/"${label}".*.log; do
              [[ -e "$f" ]] || continue
              irc=$(cat "${f}.rc" 2>/dev/null || echo 1)
              [[ "$irc" == "0" ]] && continue
              echo "::group::[FAILED] $(basename "$f" .log) (rc=${irc})"
              cat "$f"
              echo "::endgroup::"
            done
          done < ci/ci_mgpu_queue.conf
          exit $EXIT_STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-mgpu-${{ matrix.arch_label }}
          path: ${{ env.TE_CI_DATA_DIR }}/**
          if-no-files-found: ignore
          retention-days: 5
          overwrite: true

      - name: Cleanup container
        if: always()
        run: docker rm -f te-runner || true

  # gfx1250 emulated on the CPU by rocjitsu (ci/rocjitsu.sh), so this needs no GPU: it runs
  # on the runner named by the repository variable TE_CPU_TEST_RUNNER, as one queue
  # (ci/run_queue.sh --queue emu) with an item per CPU slot.
  emu_tests:
    name: Emulated gfx1250 Tests
    needs: [scope, build]
    # build is skipped when an earlier build is reused
    if: >-
      !cancelled()
      && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.scope.outputs.wheels_run_id != ''))
      && needs.scope.outputs.emu_suites != ''
    permissions:
      contents: read
      actions: read
    # Advisory until the emulator and the test selection have proven stable
    continue-on-error: true
    timeout-minutes: 240
    runs-on: ${{ vars.TE_CPU_TEST_RUNNER || 'build-only-te' }}
    env:
      # CPU runners can be shared, so the container name is unique to this run
      CONTAINER: te-emu-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize required submodules
        run: |
          git submodule update --init --recursive --depth 1 \
            3rdparty/googletest \
            3rdparty/hipify_torch \
            3rdparty/composable_kernel

      - name: Get rocjitsu revision and base image
        id: rocjitsu
        run: |
          echo "ref=$(sed -n 's/^: \${ROCJITSU_REF:=\([0-9a-f]*\)}$/\1/p' ci/rocjitsu.sh)" >> "$GITHUB_OUTPUT"
          echo "base_image=$(sed -n 's/^base-image = "\(.*\)"$/\1/p' ci/deps/pyproject.toml)" >> "$GITHUB_OUTPUT"

      # ci/rocjitsu.sh reuses a build of the same rocm-systems commit
      - name: Cache rocjitsu build
        uses: actions/cache@v6
        with:
          path: build/rocjitsu
          key: rocjitsu-${{ steps.rocjitsu.outputs.ref }}-${{ steps.rocjitsu.outputs.base_image }}

      # Download artifacts and set up the test container concurrently
      - parallel:
          - name: Download build artifacts
            uses: actions/download-artifact@v8
            with:
              name: te-rocm-wheels-${{ needs.scope.outputs.build_key }}
              path: dist/
              # A reused build is in an earlier run
              github-token: ${{ needs.scope.outputs.wheels_run_id && github.token || '' }}
              run-id: ${{ needs.scope.outputs.wheels_run_id || github.run_id }}

          - name: Start container
            env:
              TE_CI_BASE_IMAGE: ${{ steps.rocjitsu.outputs.base_image }}
            run: |
              # A plain OS image with the torch venv, which the emulated suite runs in. The
              # runner has no GPU: the first arch's device libraries stand in, and
              # ci/rocjitsu.sh adds gfx1250's. Flash Attention isn't built for gfx1250.
              SECONDS=0
              docker pull "$TE_CI_BASE_IMAGE"
              # --init reaps the helper processes of emulator runs that were killed
              docker run -dt \
                --rm \
                --init \
                --name "$CONTAINER" \
                --network=host \
                --shm-size=16G \
                -e TE_CI_TORCH_VENV=/opt/venv-torch \
                -e VIRTUAL_ENV=/opt/venv-torch \
                -e PATH=/opt/venv-torch/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                -v "${{ github.workspace }}:/workspace" \
                -w /workspace \
                "$TE_CI_BASE_IMAGE"
              docker exec "$CONTAINER" bash ci/install_deps.sh --frameworks torch --no-gpu-check --no-flash-attn
              echo "Test environment ready in ${SECONDS} s"

      - name: Install packages
        run: |
          docker exec "$CONTAINER" bash -c "$(cat <<'EOF'
          set -ex
          # core (cpp) tests build via cmake inside the repo; allow git ops in-tree.
          git config --global --add safe.directory '*'

          TE_CORE_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm[0-9]*.whl' | sort | head -n 1)
          TE_TORCH_PKG=$(find /workspace/dist -type f -name 'transformer_engine_rocm_torch*.tar.gz' | sort | head -n 1)
          test -n "$TE_CORE_PKG" && test -n "$TE_TORCH_PKG"

          # Into the torch venv, the container's default; the build tools are in the locks
          pip install --no-deps "$TE_CORE_PKG"
          pip install --no-build-isolation --no-deps "$TE_TORCH_PKG"
          EOF
          )"

      - name: Restore learned test weights
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/weights
          key: te-emu-weights-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-emu-weights-l${{ env.TEST_LEVEL }}-

      # What failed on an earlier attempt of this run; see the sGPU job.
      - name: Restore the previous attempt's failed items
        if: needs.scope.outputs.ran_in_attempt != github.run_attempt
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/rerun
          key: te-emu-rerun-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: te-emu-rerun-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-

      - name: Run emulated tests as one queue
        id: run-tests
        # Below the job's timeout-minutes so an overrun kills only this step;
        # the `if: always()` report + upload steps still run (artifacts survive).
        timeout-minutes: 210
        run: |
          rm -rf "$TE_CI_DATA_DIR/test-results"
          mkdir -p "$TE_CI_DATA_DIR/weights" "$TE_CI_DATA_DIR/rerun"

          docker exec \
            -e TEST_LEVEL=${{ env.TEST_LEVEL }} \
            -e TE_CI_DATA_DIR \
            -e JUNITXML_PREFIX="/workspace/$TE_CI_DATA_DIR/test-results/" \
            -e JUNITXML_SUFFIX=.xml \
            -e GITHUB_ACTIONS \
            -e TE_CI_EMU_SLOTS="${{ vars.TE_CI_EMU_SLOTS || '8' }}" \
            -e TE_CI_SUITES="${{ needs.scope.outputs.emu_suites }}" \
            "$CONTAINER" bash -c "ulimit -c 0; exec bash /workspace/ci/run_queue.sh --queue emu \
              --log-dir /workspace/$TE_CI_DATA_DIR/test-results/logs"

      - name: Save learned test weights
        if: always() && hashFiles(format('{0}/weights/*', env.TE_CI_DATA_DIR)) != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/weights
          key: te-emu-weights-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate test report
        if: always()
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "Results from attempt ${ATTEMPT} of this run." >> "$GITHUB_STEP_SUMMARY"
          command -v python3 >/dev/null 2>&1 || { echo "python3 not available; skipping report"; exit 0; }
          python3 ci/junit_report.py "$TE_CI_DATA_DIR/test-results/gfx1250-emu" --title "Emulated gfx1250 (rocjitsu)"
          if [ -f "$TE_CI_DATA_DIR/test-results/logs/report/schedule.md" ]; then
            cat "$TE_CI_DATA_DIR/test-results/logs/report/schedule.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no schedule.md -- the queue did not reach its report phase"
          fi

      - name: Save this attempt's failed items
        if: always() && hashFiles(format('{0}/rerun/**', env.TE_CI_DATA_DIR)) != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TE_CI_DATA_DIR }}/rerun
          key: te-emu-rerun-l${{ env.TEST_LEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check suite failure status
        if: always()
        run: |
          EXIT_STATUS=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue
            read -r label logfile rest <<< "$line"
            rc=$(cat "$TE_CI_DATA_DIR/test-results/logs/suites/${logfile}.rc" 2>/dev/null || echo "missing")
            [[ "$rc" == "0" ]] && continue
            echo "::error::${label} tests FAILED (rc=${rc})."
            EXIT_STATUS=1
            for f in "$TE_CI_DATA_DIR"/test-results/logs/items/"${label}".*.log; do
              [[ -e "$f" ]] || continue
              irc=$(cat "${f}.rc" 2>/dev/null || echo 1)
              [[ "$irc" == "0" ]] && continue
              echo "::group::[FAILED] $(basename "$f" .log) (rc=${irc})"
              cat "$f"
              echo "::endgroup::"
            done
          done < ci/ci_emu_queue.conf
          exit $EXIT_STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-emu
          path: ${{ env.TE_CI_DATA_DIR }}/**
          if-no-files-found: ignore
          retention-days: 5
          overwrite: true

      - name: Cleanup container
        if: always()
        run: docker rm -f "$CONTAINER" || true
