name: TransformerEngine CI

on:
  push:
    branches:
      - 'dev'
      - 'leo/*'
      - 'release_v1.*_rocm'
      - 'release_v2.*_rocm'
  pull_request:
    branches:
      - 'dev'
      - 'release_v1.**_rocm'
      - 'release_v2.**_rocm'
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test Level (1-3)'
        required: true
        default: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Select Docker Image
    runs-on: build-only
    outputs:
      docker-image: ${{ steps.select-image.outputs.image-tag }}
    steps:
      - name: 📜 Checkout repository
        uses: actions/checkout@v4

      - name: 🖼️ Select Docker Image
        id: select-image
        run: |
          BRANCH_NAME="${{ github.base_ref || github.ref_name }}"
          echo "Determining image for branch: $BRANCH_NAME"
          DEV_DOCKER_IMAGE="compute-artifactory.amd.com:5000/rocm-plus-docker/framework/private/te-ci:rocm-6.4_0_ubuntu22_py310_torch25_jax0435qa_fa273"
          REL613_DOCKER_IMAGE="compute-artifactory.amd.com:5000/rocm-plus-docker/framework/private/te-ci:rocm-6.4_0_ubuntu22_py310_torch25_jax0435qa_fa273"
          LEGACY_DOCKER_IMAGE="compute-artifactory.amd.com:5000/rocm-plus-docker/framework/private/te-ci:rocm-6.3_66_ubuntu22_py310_torch25_jax0431_fa263_hipblaslt10patch.2"
          IMAGE_TO_USE="$DEV_DOCKER_IMAGE"
          if [[ $BRANCH_NAME =~ ^release_v([0-9]+)\.([0-9]+)_rocm$ ]]; then
            MAJOR_VERSION=${BASH_REMATCH[1]}
            MINOR_VERSION=${BASH_REMATCH[2]}
            if (( MAJOR_VERSION == 1 )); then
              if (( MINOR_VERSION >= 9 && MINOR_VERSION <= 12 )); then
                IMAGE_TO_USE="$LEGACY_DOCKER_IMAGE"
              elif (( MINOR_VERSION == 13 || MINOR_VERSION == 14 )); then
                IMAGE_TO_USE="$REL613_DOCKER_IMAGE"
              fi
            fi
          fi
          echo "Selected image: $IMAGE_TO_USE"
          echo "image-tag=$IMAGE_TO_USE" >> $GITHUB_OUTPUT

  build_and_test:
    name: Build & Test - ${{ matrix.framework }} (${{ matrix.gpu_mode }})
    needs: setup
    runs-on: [te-gfx942-4gpu]
    strategy:
      fail-fast: false
      matrix:
        framework: ['PyTorch', 'JAX']
        gpu_mode: ['Single-GPU', 'Multi-GPU']
        include:
          - framework: 'Core'
            gpu_mode: 'Single-GPU'
          - framework: 'Examples'
            gpu_mode: 'Single-GPU'
    
    steps:
      - name: 📜 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 🔐 Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ARTIFACTORY_USER }}
          password: ${{ secrets.ARTIFACTORY_PAT }}

      - name: 🚀 Run and Prepare Container
        run: |
          docker run -dt \
            --name te-ci-runner \
            --device=/dev/dri --device=/dev/kfd \
            --shm-size=16G \
            --group-add $(getent group render | cut -d: -f3) \
            --group-add $(getent group video | cut -d: -f3) \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ needs.setup.outputs.docker-image }}
          
          # Prepare the container environment once
          docker exec te-ci-runner bash -c "apt-get update && apt-get install -y build-essential && pip install --upgrade pip ninja"

      - name: 📦 Build Wheel
        run: |
          docker exec te-ci-runner bash -c "$(cat <<'EOF'
          set -ex
          
          # Install custom CMake
          CMAKE_LINK="https://github.com/Kitware/CMake/releases/download/v3.31.2/cmake-3.31.2-linux-x86_64.sh"
          wget -q -P /opt ${CMAKE_LINK}
          chmod +x /opt/cmake-*.sh
          bash /opt/cmake-*.sh --skip-license --prefix=/opt/cmake
          ln -sf /opt/cmake/bin/* /usr/bin/ || true
          
          # Set build environment
          export HIP_PATH=""
          export PATH=/opt/cmake/bin:$PATH
          export PYTORCH_ROCM_ARCH=gfx942
          export NVTE_ROCM_ARCH=gfx942
          
          # Build the wheel
          pip wheel . -v -w /workspace/dist
          EOF
          )"
          
      - name: 🐍 Install Wheel
        run: |
          docker exec te-ci-runner bash -c "pip install /workspace/dist/*.whl"
          
      - name: 🧪 Run Tests
        run: |
          docker exec \
            -e FRAMEWORK=${{ matrix.framework }} \
            -e GPU_MODE=${{ matrix.gpu_mode }} \
            te-ci-runner bash -c '
              set -ex
              
              echo "Running tests for $FRAMEWORK ($GPU_MODE)"
              
              if [ "$FRAMEWORK" = "PyTorch" ]; then
                if [ "$GPU_MODE" = "Single-GPU" ]; then HIP_VISIBLE_DEVICES=1 ci/pytorch.sh; else ci/pytorch.sh; fi
              elif [ "$FRAMEWORK" = "JAX" ]; then
                if [ "$GPU_MODE" = "Single-GPU" ]; then HIP_VISIBLE_DEVICES=2 ci/jax.sh; else ci/jax.sh; fi
              elif [ "$FRAMEWORK" = "Core" ]; then
                HIP_VISIBLE_DEVICES=3 ci/core.sh
              elif [ "$FRAMEWORK" = "Examples" ]; then
                pip3 install -r examples/jax/mnist/requirements.txt
                pip3 install -r examples/jax/encoder/requirements.txt
                python examples/pytorch/mnist/main.py && python examples/pytorch/mnist/main.py --use-te && python examples/pytorch/mnist/main.py --use-fp8
                python examples/jax/mnist/test_single_gpu_mnist.py && python examples/jax/mnist/test_single_gpu_mnist.py --use-te && python examples/jax/mnist/test_single_gpu_mnist.py --use-fp8
                python examples/jax/encoder/test_single_gpu_encoder.py && python examples/jax/encoder/test_single_gpu_encoder.py --use-fp8
              fi
            '
            
      - name: 🧹 Cleanup container
        if: always()
        run: docker rm -f te-ci-runner || true