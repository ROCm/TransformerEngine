name: TransformerEngine CI

on:
  push:
    branches:
      - 'dev'
      - 'release_v1.*_rocm'
      - 'release_v2.*_rocm'
  pull_request:
    branches:
      - 'dev'
      - 'release_v1.**_rocm'
      - 'release_v2.**_rocm'
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test Level (1-3)'
        required: true
        default: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Docker Image Artifact
    runs-on: build-only
    outputs:
      docker-image-tag: ${{ steps.select-image.outputs.image-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Docker Image Tag
        id: select-image
        run: |
          BRANCH_NAME="${{ github.base_ref || github.ref_name }}"
          echo "Determining image for branch: $BRANCH_NAME"
          DEV_DOCKER_IMAGE="compute-artifactory.amd.com:5000/rocm-plus-docker/framework/private/te-ci:rocm-6.4_0_ubuntu22_py310_torch25_jax0435qa_fa273"
          REL613_DOCKER_IMAGE="compute-artifactory.amd.com:5000/rocm-plus-docker/framework/private/te-ci:rocm-6.4_0_ubuntu22_py310_torch25_jax0435qa_fa273"
          LEGACY_DOCKER_IMAGE="compute-artifactory.amd.com:5000/rocm-plus-docker/framework/private/te-ci:rocm-6.3_66_ubuntu22_py310_torch25_jax0431_fa263_hipblaslt10patch.2"
          IMAGE_TO_USE="$DEV_DOCKER_IMAGE"
          if [[ $BRANCH_NAME =~ ^release_v([0-9]+)\.([0-9]+)_rocm$ ]]; then
            MAJOR_VERSION=${BASH_REMATCH[1]}
            MINOR_VERSION=${BASH_REMATCH[2]}
            if (( MAJOR_VERSION == 1 )); then
              if (( MINOR_VERSION >= 9 && MINOR_VERSION <= 12 )); then IMAGE_TO_USE="$LEGACY_DOCKER_IMAGE"; fi
              if (( MINOR_VERSION == 13 || MINOR_VERSION == 14 )); then IMAGE_TO_USE="$REL613_DOCKER_IMAGE"; fi
            fi
          fi
          echo "Selected image: $IMAGE_TO_USE"
          echo "image-tag=$IMAGE_TO_USE" >> $GITHUB_OUTPUT

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ARTIFACTORY_USER }}
          password: ${{ secrets.ARTIFACTORY_PAT }}
      
      - name: Pull and Save Docker Image
        run: |
          docker pull ${{ steps.select-image.outputs.image-tag }}
          docker save -o image.tar ${{ steps.select-image.outputs.image-tag }}
          # Split the tarball into 2GB chunks to avoid upload timeout
          split -b 2G image.tar "image.tar."
      
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-chunks
          path: image.tar.*
          retention-days: 1

  build_and_test:
    name: Build and Test on GPU
    needs: prepare
    runs-on: [te-gfx942-4gpu]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Download Docker image chunks
        uses: actions/download-artifact@v4
        with:
          name: docker-image-chunks

      - name: Reassemble and Load Image to Node Cache
        run: |
          # Only load the image if it's not already on the node
          IMAGE_TAG="${{ needs.prepare.outputs.docker-image-tag }}"
          if [ -z "$(docker images -q $IMAGE_TAG)" ]; then
            echo "Image not found in node cache. Loading from artifact..."
            cat image.tar.* > image.tar
            docker load -i image.tar
          else
            echo "Image found in node cache. Skipping load."
          fi

      - name: Run Container
        run: |
          docker run -dt \
            --name te-runner \
            --device=/dev/dri --device=/dev/kfd \
            --shm-size=16G \
            --group-add $(getent group render | cut -d: -f3) \
            --group-add $(getent group video | cut -d: -f3) \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ needs.prepare.outputs.docker-image-tag }}
      
      - name: Build Project
        run: |
          docker exec te-runner bash -c "$(cat <<'EOF'
          set -ex
          apt-get update && apt-get install -y build-essential
          CMAKE_LINK="https://github.com/Kitware/CMake/releases/download/v3.31.2/cmake-3.31.2-linux-x86_64.sh"
          wget -q -P /opt $CMAKE_LINK
          chmod +x /opt/cmake-*.sh
          mkdir -p /opt/cmake
          bash /opt/cmake-*.sh --skip-license --prefix=/opt/cmake
          ln -sf /opt/cmake/bin/* /usr/bin/ || true
          
          export HIP_PATH=""
          export PATH=/opt/cmake/bin:$PATH
          export PYTORCH_ROCM_ARCH=gfx942
          export NVTE_ROCM_ARCH=gfx942
          pip install --upgrade pip
          pip install ninja
          pip wheel . -v -w /workspace/dist
          pip install /workspace/dist/*.whl
          EOF
          )"

      - name: Run sGPU tests
        run: |
          docker exec te-runner bash -c "$(cat <<'EOF'
          #!/usr/bin/bash
          set -x -o pipefail

          HIP_VISIBLE_DEVICES=1 JUNITXML_PREFIX=junit_reports/torch_ JUNITXML_SUFFIX=.xml ci/pytorch.sh > /workspace/torch_sgpu.log 2>&1 &
          torch_pid=$!; echo Pytorch test pid $!
          
          HIP_VISIBLE_DEVICES=2 JUNITXML_PREFIX=junit_reports/jax_ JUNITXML_SUFFIX=.xml ci/jax.sh > /workspace/jax_sgpu.log 2>&1 &
          jax_pid=$!; echo JAX test pid $!
          
          HIP_VISIBLE_DEVICES=3 GTEST_OUTPUT="xml:/workspace/gtest_reports/" ci/core.sh > /workspace/core_sgpu.log 2>&1 &
          core_pid=$!; echo Core test pid $!
          
          wait $core_pid; core_rc=$?
          wait $jax_pid; jax_rc=$?
          wait $torch_pid; torch_rc=$?
          
          if [ $torch_rc -ne 0 ]; then echo "Pytorch sGPU test FAILED."; fi
          if [ $jax_rc -ne 0 ]; then echo "JAX sGPU test FAILED."; fi
          if [ $core_rc -ne 0 ]; then echo "Core sGPU test FAILED."; fi
          
          test $torch_rc -eq 0 -a $jax_rc -eq 0 -a $core_rc -eq 0
          EOF
          )"
      
      - name: Run mGPU tests
        run: |
          docker exec te-runner bash -c "$(cat <<'EOF'
          #!/usr/bin/bash
          set -x -o pipefail
          
          JUNITXML_PREFIX=junit_reports/torch_ JUNITXML_SUFFIX=.xml ci/pytorch.sh > /workspace/torch_mgpu.log 2>&1; torch_rc=$?
          JUNITXML_PREFIX=junit_reports/jax_ JUNITXML_SUFFIX=.xml ci/jax.sh > /workspace/jax_mgpu.log 2>&1; jax_rc=$?
          
          if [ $torch_rc -ne 0 ]; then echo "Pytorch mGPU test FAILED."; fi
          if [ $jax_rc -ne 0 ]; then echo "JAX mGPU test FAILED."; fi
          
          test $torch_rc -eq 0 -a $jax_rc -eq 0
          EOF
          )"

      - name: Run Examples
        run: |
          docker exec te-runner bash -c "$(cat <<'EOF'
          #!/usr/bin/bash
          set -ex -o pipefail

          cd /workspace/examples/pytorch/mnist
          python main.py
          python main.py --use-te
          python main.py --use-fp8
          
          cd /workspace/examples/jax/mnist
          pip3 install -r requirements.txt
          python test_single_gpu_mnist.py
          python test_single_gpu_mnist.py --use-te
          python test_single_gpu_mnist.py --use-fp8
          
          cd /workspace/examples/jax/encoder
          pip3 install -r requirements.txt
          python test_single_gpu_encoder.py
          python test_single_gpu_encoder.py --use-fp8
          EOF
          )"

      - name: Copy logs and reports from container
        if: always()
        run: |
          docker cp te-runner:/workspace/junit_reports ./junit_reports || true
          docker cp te-runner:/workspace/gtest_reports ./gtest_reports || true
          docker cp te-runner:/workspace/torch_sgpu.log ./torch_sgpu.log || true
          docker cp te-runner:/workspace/jax_sgpu.log ./jax_sgpu.log || true
          docker cp te-runner:/workspace/core_sgpu.log ./core_sgpu.log || true
          docker cp te-runner:/workspace/torch_mgpu.log ./torch_mgpu.log || true
          docker cp te-runner:/workspace/jax_mgpu.log ./jax_mgpu.log || true

      - name: Upload logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-reports
          path: |
            junit_reports/
            gtest_reports/
            *.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Cleanup container
        if: always()
        run: docker rm -f te-runner || true