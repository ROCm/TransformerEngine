name: Claude PR Action

# Worker workflow: performs a code review or an explanatory summary on a PR.
# Triggered by claude-pr-trigger.yml via repository_dispatch, or manually.
#
# client_payload schema:
#   action:      "review" | "summary"
#   pull_number: number
#   base:        string (PR's merge target ref, e.g. "dev" or "release_v2.0_rocm")

on:
  repository_dispatch:
    types: [claude-pr-action]
  workflow_dispatch:
    inputs:
      action:
        description: 'review or summary'
        required: true
        type: choice
        options: [review, summary]
      pr_number:
        description: 'PR number'
        required: true
        type: number
      base:
        description: 'PR base branch (default: repo default branch)'
        required: false
        type: string

concurrency:
  # One Claude job per (PR, action) at a time; cancel superseded runs.
  group: claude-pr-${{ github.event.client_payload.pull_number || inputs.pr_number }}-${{ github.event.client_payload.action || inputs.action }}
  cancel-in-progress: true

jobs:
  claude:
    # Self-hosted runner — required so the job has network access to the AMD
    # internal LLM gateway (ANTHROPIC_BASE_URL). Code review does not need a
    # GPU; using `linux-te-mi325-8` here only because it is the smallest label
    # already provisioned for this repo (see rocm-ci.yml). Swap for a lighter
    # CPU-only label if/when one becomes available.
    runs-on: linux-te-mi325-8
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write  # Required for claude-code-action OIDC exchange.
    env:
      ACTION: ${{ github.event.client_payload.action || inputs.action }}
      PR_NUMBER: ${{ github.event.client_payload.pull_number || inputs.pr_number }}
      # Diff against the PR's actual merge target. Falls back to the repo
      # default branch only if the dispatcher (or workflow_dispatch input) did
      # not provide one — keeps re-runs and manual invocations functional.
      BASE_REF: ${{ github.event.client_payload.base || inputs.base || github.event.repository.default_branch }}
    steps:
      # The TE self-hosted runners do not ship `gh` or `jq`. Install standalone
      # binaries into $RUNNER_TEMP/bin and add it to $GITHUB_PATH so subsequent
      # steps (including Claude's Bash tool) can invoke them. Skips if a tool
      # is already present, so this is a no-op on runners that have them.
      - name: Bootstrap gh + jq
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"

          if ! command -v jq >/dev/null 2>&1; then
            curl -fsSL -o "$bin/jq" \
              https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
            chmod +x "$bin/jq"
          fi

          if ! command -v gh >/dev/null 2>&1; then
            gh_ver="2.62.0"
            curl -fsSL \
              "https://github.com/cli/cli/releases/download/v${gh_ver}/gh_${gh_ver}_linux_amd64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP"
            ln -sf "$RUNNER_TEMP/gh_${gh_ver}_linux_amd64/bin/gh" "$bin/gh"
          fi

          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          gh --version | head -1
          jq --version

      # refs/pull/<n>/head exists on the base repo for every PR (including forks),
      # so this works regardless of where the PR originated.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0

      # The PR branch may not include .claude/ (skills, settings). Always
      # overlay from the repo default branch (skills are maintained there),
      # not from the PR's base — release branches typically don't carry them.
      # Also fetch BASE_REF separately so review/diff steps can compare against
      # the PR's actual merge target.
      - name: Overlay .claude config and fetch base ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          if [[ "$BASE_REF" != "$DEFAULT_BRANCH" ]]; then
            git fetch origin "$BASE_REF"
          fi
          if git cat-file -e "origin/$DEFAULT_BRANCH:.claude" 2>/dev/null; then
            git restore --source="origin/$DEFAULT_BRANCH" --worktree -- .claude
          fi

      # Workaround mirrored from ROCm/xla: pre-install Claude Code so the
      # action does not hang during first-run init.
      - name: Install and warm up Claude Code
        timeout-minutes: 2
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_CUSTOM_HEADERS: "Ocp-Apim-Subscription-Key: ${{ secrets.LLM_GATEWAY_KEY }}"
          ANTHROPIC_API_KEY: "sk-ant-dummy-gateway-key"
          ANTHROPIC_MODEL: "Claude-Sonnet-4.6"
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          timeout 60 claude --print -p "Say OK" || echo "Warmup complete"

      # claude-code-action only auto-configures the inline-comment MCP server
      # for pull_request* events. We trigger via repository_dispatch, so wire
      # it up manually with the PR number from the payload.
      - name: Configure inline-comment MCP
        id: mcp
        run: |
          set -euo pipefail
          server=$(find "$(dirname "$RUNNER_WORKSPACE")/_actions/anthropics/claude-code-action" \
                   -name "github-inline-comment-server.ts" 2>/dev/null | head -1)
          cat > /tmp/mcp-config.json <<EOF
          {
            "mcpServers": {
              "github_inline_comment": {
                "command": "bun",
                "args": ["run", "$server"],
                "env": {
                  "REPO_OWNER": "${{ github.repository_owner }}",
                  "REPO_NAME":  "${{ github.event.repository.name }}",
                  "PR_NUMBER":  "${{ env.PR_NUMBER }}",
                  "GITHUB_API_URL": "${{ github.api_url }}"
                }
              }
            }
          }
          EOF
          echo "file=/tmp/mcp-config.json" >> "$GITHUB_OUTPUT"

      # ---- REVIEW ----
      - name: Run Claude — Code Review
        id: review
        if: env.ACTION == 'review'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_CUSTOM_HEADERS: "Ocp-Apim-Subscription-Key: ${{ secrets.LLM_GATEWAY_KEY }}"
          ANTHROPIC_MODEL: "Claude-Opus-4.7"
          ANTHROPIC_DEFAULT_OPUS_MODEL:   "Claude-Opus-4.7"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "Claude-Sonnet-4.6"
          ANTHROPIC_DEFAULT_HAIKU_MODEL:  "Claude-Haiku-4.5"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: "sk-ant-dummy-gateway-key"
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          claude_args: |
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh *),Bash(git *),Bash(jq *),Bash(head *),Bash(grep *),Read,Grep,Glob" --mcp-config ${{ steps.mcp.outputs.file }}
          settings: |
            { "hasCompletedOnboarding": true }
          prompt: |
            REPO: ${{ github.repository }}
            PR:   ${{ env.PR_NUMBER }}
            BASE: ${{ env.BASE_REF }}   # PR's actual merge target

            The PR branch is checked out in the working directory. Diff
            against `origin/${{ env.BASE_REF }}` for every comparison —
            this is the PR's merge target, which may not be the repo's
            default branch (e.g., release branches).

            ## 1. Gather prior context
            Use `gh` to enumerate signals that should shape this review:
              a. Prior Claude inline comments (top-level only):
                 ```
                 gh api --paginate "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments" \
                   | jq -s 'add // [] | [.[] | select(.user.login == "claude[bot]" and .in_reply_to_id == null)]'
                 ```
              b. Prior human reviews and review comments — note any unresolved
                 threads or themes already raised by reviewers; do not duplicate.
              c. Top-level PR comments from `claude[bot]` (prior summaries).

            ## 2. Produce findings
            Run BOTH skills below and merge their findings before posting. Each
            covers a distinct concern; neither subsumes the other.

            **2a. Code review** — `/review-pr` (vendored in `.claude/skills/`).
            Pass the PR number and base branch so it scopes the diff correctly:
              `/review-pr ${{ env.PR_NUMBER }} --base origin/${{ env.BASE_REF }}`

            If a prior Claude review exists (step 1a returned non-empty),
            instruct the skill to focus on commits added since the most recent
            claude[bot] inline-comment timestamp — re-reading the entire diff
            is wasteful and produces duplicate noise.

            **2b. Copyright header audit** — `/copyright-check` (vendored in
            `.claude/skills/`). This is the AMD-side counterpart to
            `qa/L0_license/copyright_checker.py` and verifies that ROCm-modified
            and ROCm-introduced files carry correct AMD headers with up-to-date
            year ranges, without altering preserved NVIDIA copyrights:
              `/copyright-check origin/${{ env.BASE_REF }}`

            Run this on every review (initial and re-review). Copyright
            findings are typically actionable on a single line, so prefer
            inline comments on the offending header line for each finding.

            Do NOT post anything to GitHub yet; collect findings from both
            skills in memory and dedupe against step 1 before posting.

            ## 3. Post results
            - For each finding (from 2a or 2b), call
              `mcp__github_inline_comment__create_inline_comment` on the
              relevant diff line. Skip findings that duplicate any comment
              from step 1 (Claude's or a human reviewer's).
            - Post ONE short top-level summary via `gh pr comment` describing
              what was reviewed and the high-level verdict. Mention the
              copyright audit result as a single line (e.g. "Copyright
              headers: OK" or "Copyright headers: 3 files need updates —
              see inline comments"). Do not repeat individual findings.
            - If this is a re-review and there are no new findings, post a
              brief top-level comment saying so.
            - Do NOT post intermediate analysis or thinking to the PR.

      # ---- SUMMARY / WALKTHROUGH ----
      - name: Run Claude — Summary & Walkthrough
        id: summary
        if: env.ACTION == 'summary'
        timeout-minutes: 20
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_CUSTOM_HEADERS: "Ocp-Apim-Subscription-Key: ${{ secrets.LLM_GATEWAY_KEY }}"
          ANTHROPIC_MODEL: "Claude-Opus-4.7"
          ANTHROPIC_DEFAULT_OPUS_MODEL:   "Claude-Opus-4.7"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "Claude-Sonnet-4.6"
          ANTHROPIC_DEFAULT_HAIKU_MODEL:  "Claude-Haiku-4.5"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: "sk-ant-dummy-gateway-key"
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          claude_args: |
            --allowedTools "Skill,Bash(gh *),Bash(git *),Bash(jq *),Read,Grep,Glob"
          settings: |
            { "hasCompletedOnboarding": true }
          prompt: |
            REPO: ${{ github.repository }}
            PR:   ${{ env.PR_NUMBER }}
            BASE: ${{ env.BASE_REF }}   # PR's actual merge target

            The PR branch is checked out. Use `origin/${{ env.BASE_REF }}` as
            the base for any diff or comparison — it is the PR's merge target,
            which may not be the repo's default branch.

            ## Goal
            Produce ONE top-level PR comment that helps a reader understand
            this change without reading every line of the diff. This is an
            explanatory artifact, NOT a review — do not flag issues here.

            ## 1. Check for prior summaries
            ```
            gh api --paginate "repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/comments" \
              | jq -s 'add // [] | [.[] | select(.user.login == "claude[bot]") | .body] | .[] | select(test("Claude Walkthrough"))'
            ```
            If a prior summary exists, edit it (gh api PATCH on the comment id)
            instead of posting a new one — keep one canonical walkthrough that
            reflects the current state of the PR. Otherwise, post a new one.

            ## 2. Build the walkthrough
            Read the PR title/description and `git diff origin/${{ env.BASE_REF }}...HEAD`.
            Use `Grep`/`Read` to ground claims in the actual code.

            Format the comment exactly as:

            ```markdown
            ## Claude Walkthrough

            **Intent.** 1–3 sentences on what problem this PR solves and why,
            inferred from the description and the diff.

            **Key changes.**
            - Bullet per logically distinct change. Reference files as
              `path/to/file.py:LINE` when pointing to a specific construct.

            **Walkthrough.**
            File-by-file (or component-by-component) prose for the non-trivial
            changes. Skip pure renames, formatting, and generated files.
            Explain *why* a change was made when it is not self-evident.

            **Testing.** What tests were added/changed, and what behavior
            they cover. If no tests were added, say so.

            **Notes for reviewers.** Anything subtle: invariants relied on,
            backwards-compat concerns, perf implications, follow-ups deferred.

            ---
            _Generated by Claude. To request a code review, comment `/claude review`._
            ```

            Keep it tight. A reader should be able to skim it in under a minute
            and know whether they need to dive deeper. Do NOT post inline
            comments and do NOT post anything other than this single top-level
            comment.

      - name: Upload Claude execution log
        if: always() && (steps.review.outputs.execution_file != '' || steps.summary.outputs.execution_file != '')
        uses: actions/upload-artifact@v4
        with:
          name: claude-${{ env.ACTION }}-pr${{ env.PR_NUMBER }}-log
          path: ${{ steps.review.outputs.execution_file || steps.summary.outputs.execution_file }}

      - name: Remove trigger label
        if: always() && github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="claude-${{ env.ACTION }}"
          gh api --method DELETE \
            "/repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/labels/$label" \
            || true
