# plus the tripped fp4 kernel's sibling (one kernel family, one strategy). freeze (A) assigned
# to no file, per plan. Regenerate the census with tools/ (s41 census rules) at every pin bump;
# a file that trips on 2 consecutive pin bumps is promoted to native-hip review.
# Census at pin 868d8d9216da: 92 modified C++ files, 6329 changed lines, 507 guard sites.
# (Manifest cxx_facts said 85 files: that count excluded public headers under include/ and
#  counted at the previous measurement; this file is the per-file authority from S4.1 on.)
# assignment (amended): 3 native-hip, 89 patch-queue
# AMENDED 2026-09-01 (same day, on per-file divergence measurement): the two fused_router
# files tripped in B3 on UPSTREAM CHURN in the whole-file replay, while their fork-side
# divergence is 2 and 7 added lines with 0-1 guards. Converting ~700-1500 lines to native-hip
# to escape a <=7-line patch inverts the program's goal - a churn-tripped tiny patch is a
# minutes-scale repair; a native fork is a permanent full-file divergence. They return to
# patch-queue. The amended rule: native-hip requires trip evidence AND substantial fork-side
# divergence (guards or changed-share), not churn-trips alone.
