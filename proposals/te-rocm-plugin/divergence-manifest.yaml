open_decisions:
  release_218_gap:
    question: >-
      The fork sits at the release_v2.18 BRANCH POINT, not the release. Do we take the 15
      release_v2.18 commits (1,339 lines in scope) before pinning, or pin a later main commit?
    why_it_matters: >-
      The architecture vendors a PINNED upstream. Pinning 868d8d92 ships a distribution
      labelled 2.18 that lacks 2.18's entire stabilisation - including FP8 block scaling for
      fusible ops (#3242), the fused FP8 block-scaling path in GroupedLinear (#3171), NCCL EP
      zero-copy (#3187), cuDNN D=256 BWD attention (#3056), a CP padding bugfix (#3269), and
      the VERSION bump itself.
    owner: none    # 2026-08-30: no owners assigned at this stage
    due: Stage 0
    status: DECIDED
    decided_on: 2026-08-30
    decision: >-
      Prototype pins 868d8d92 (matches the compiled C++ exactly; no confound). The shipping pin
      follows ifu_sourcing_policy: `dev` tracks upstream main, so dev stays at a main SHA; a ROCm
      release branch tracks the matching upstream release branch and therefore takes the
      stabilisation commits (the 15 for 2.18) there. The 'gap' is resolved by branch policy,
      not by moving dev's pin.
  ifu_sourcing_policy:
    question: "Fix the IFU procedure: always merge from upstream main at a chosen SHA."
    why_it_matters: >-
      IFU 2.17 merged 2e559f06, which is on release_v2.17 but NOT on main - confirmed as done
      the wrong way - pulling 10 non-main commits into fork history and contributing conflict
      burden to the 2.18 IFU. IFU 2.18 merged a main commit but took the branch point.
      Neither matches a stated policy because none exists.
    owner: none
    due: Stage 0
    status: DECIDED
    decided_on: 2026-08-30
    decision: >-
      Two-track. `dev` IFUs merge upstream `main` at a chosen SHA. A ROCm release branch
      (release_vX_rocm) IFUs merge the matching upstream `release_vX` branch. Release branches are
      never merged into dev; a release-only fix that dev needs is cherry-picked as a
      manifest-tracked patch. The 3rdparty/transformer_engine_nvidia gitlink records the pin on
      each branch, and the CI identity check is branch-aware: on dev, merge-base against
      upstream/main; on release_vX_rocm, against upstream/release_vX.
    note: "this policy retroactively explains the 2.17 history (release tracking release) and makes it correct going forward"
  contract_surface_for_ctypes:
    question: "Route ABI-001 symbols through TE_ROCM_EXTENSION_API, or define a fourth versioned contract?"
    owner: none
    due: Stage 3          # was Gate B; downgraded to a work item (S3.3)
    status: DECIDED
    decided_on: 2026-08-30
    decision: >-
      Neither. Downgraded from a contract-model gap to a bookkeeping item. Upstream's own Python
      never calls an nvte_* symbol via ctypes; the fork adds two (nvte_is_rocm_build,
      nvte_uses_fp8_fnuz). ctypes needs no header - the only real issue is that these symbols
      were in NO inventory, so a core-wheel reuse decision could not see them. Resolution (plan
      S3.3): (1) a tiny versioned core-introspection C API in one public header nvte_rocm.h -
      nvte_is_rocm_build, nvte_uses_fp8_fnuz, and a new nvte_rocm_core_abi_version - which is
      ALSO how TE_ROCM_CORE_ABI is enforced at load time, since the extension is not linked
      against the core lib and nothing binds by SONAME (plan F13); (2) seam_inventory.py scans
      the fork's Python for _TE_LIB_CTYPES.<name> so ctypes demand is always inventoried.
  packaging_name_conflict:
    question: >-
      Sec 3.2 decides the canonical name `transformer-engine`; CM-002-PKGID currently implements
      transformer-engine-rocm7 / -rocm10 with rocm_pytorch / rocm_jax extras. Which wins?
    owner: none
    due: Stage 1
    status: DECIDED
    decided_on: 2026-08-30
    decision: >-
      Keep the current names: distributions transformer_engine_rocm7 / transformer_engine_rocm10 /
      transformer_engine_rocm_jax with extras rocm / rocm7 / rocm10 (setup.py:444-446,
      build_tools/utils.py:579-581, common/__init__.py:144). Proposal Sec 3.2's canonical-name +
      PEP 440 local-version scheme is WITHDRAWN. CM-002-PKGID is therefore not a conflict: the
      bootstrap patch carries the current logic unchanged. Residual co-install risk with an NVIDIA
      `transformer-engine` wheel is accepted and mitigated by the load-time provenance fingerprint
      (defense in depth) and the loud-failure property of the seam.
  cxx_maintenance_strategy:
    question: >-
      After the Python seam decouples them, how are the 85 hipified, guard-laden upstream C++ files
      maintained? A freeze / B patch-queue over the submodule then hipify / C de-guard to native HIP.
    working_default: "B for all 85, C selectively, A never as blanket policy - PROVISIONAL, open for discussion"
    evidence_required: "backtest_plan.cxx_arm trip rate and repair hours (Stage 2, informational at Gate A)"
    why_it_matters: >-
      B keeps upstream's commodity kernels flowing under the same governance as the Python queue,
      but does not shrink the divergence: the guards ARE the divergence. Whether B is a mechanized
      IFU or a relabelled one is an empirical question the C++ arm answers.
    owner: TBD
    due: Stage 4

