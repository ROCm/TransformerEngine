# The 9 early-binding sites. The facade MUST be installed in sys.modules before any of
# these modules import; `import transformer_engine_torch as tex` (44 sites) is late-bound
# and tolerant, these are not.
seam_early_binding_sites:
  star_import:
    - {path: transformer_engine/pytorch/cpp_extensions/__init__.py, line: 6, form: "from transformer_engine_torch import *"}
  named_imports:
    - transformer_engine/pytorch/cpp_extensions/fused_attn.py
    - transformer_engine/pytorch/ops/_common.py                       # FP8TensorMeta
    - transformer_engine/pytorch/ops/basic/layer_norm.py              # layernorm_bwd, layernorm_fwd
    - transformer_engine/pytorch/ops/basic/rmsnorm.py                 # rmsnorm_bwd, rmsnorm_fwd
    - transformer_engine/pytorch/ops/fused/userbuffers_backward_linear.py
    - transformer_engine/pytorch/ops/fused/userbuffers_forward_linear.py
    - transformer_engine/pytorch/optimizers/__init__.py
    - transformer_engine/pytorch/tensor/utils.py
  late_bound_sites: 44
  implication: >-
    The star-import copies the ENTIRE facade namespace into
    transformer_engine.pytorch.cpp_extensions at import time. Facade __all__ fidelity is
    therefore load-bearing, not cosmetic: any ROCm-extra symbol on the facade leaks into
    that namespace. Include __all__ equality in the TE_ROCM_EXTENSION_API conformance test.

