# TE-ROCm divergence manifest
metadata:
  manifest_version: "2.4.3"
  schema_version: "1.4"
  classifier: canonical-v2
  generator: gen_manifest (hunk classifier; regenerate per sync)
  fork_repo: https://github.com/ROCm/TransformerEngine
  fork_ref: dev
  fork_sha: 8af6efcd9a40afdf49277a1471778c5dbe4ca704   # IFU-2.18 merge, 2026-08-27

  # ---- BASE CORRECTED IN v2.4 -------------------------------------------------
  # v2.3 and earlier measured against release_v2.18 TIP (27486e03). That is NOT what
  # the fork merged. The IFU merge commit 3a49d650 has upstream parent 868d8d92,
  # which is exactly merge-base(upstream/main, fork/dev) and the point release_v2.18
  # branched off main. Measuring against the release tip charged 15 upstream commits
  # (1,339 lines in scope) to ROCm, produced five wholly phantom entries, and inverted
  # the divergence trend. See retired_entries and correction_provenance below.
  upstream_repo: https://github.com/NVIDIA/TransformerEngine
  upstream_ref: main
  upstream_sha: 868d8d9216da361c666519652115e23688db5211
  upstream_pin: 3rdparty/transformer_engine_nvidia        # git submodule, `update = none`; opt-in, non-recursive
  upstream_sha_derivation: >-
    SOURCE OF TRUTH is the submodule's recorded gitlink (`git -C 3rdparty/transformer_engine_nvidia
    rev-parse HEAD`). CI MUST assert the three-way identity: submodule HEAD == this upstream_sha ==
    merge-base(upstream/main, fork/dev). The merge-base is a cross-check that the pin is what the
    fork actually merged, never the source. Never derive from a named release branch or tag.
    The submodule carries `update = none` so the repo's documented `--init --recursive` skips it
    and upstream's own cutlass/nccl/googletest never enter the build; the overlay assembler
    initializes it explicitly and non-recursively.
  upstream_sha_notes: >-
    868d8d92 ("Fix FusedAdam empty tensor handling", #3212, 2026-07-20) is on main AND is
    the branch point of release_v2.18. The fork does NOT contain the 15 release_v2.18
    stabilisation commits - which is why VERSION is still 2.18.0.dev0. Whether to take
    those 15 commits is an open Stage-0 decision (see open_decisions.release_218_gap).

  diff_tool: >-
    GNU diff. added = count of '^>' lines, removed = count of '^<' lines. The "lines"
    figure in summary tables is added+removed. git's default Myers algorithm disagrees
    with GNU diff on some files and MUST NOT be substituted: at this base it differs on
    cpp_extensions/fused_attn.py by 1 line. Because M1 burn-down and the
    divergence-regression CI alarm are line-count based, an unpinned algorithm can
    false-trigger or mask the alarm.

  generated: 2026-08-28
  measured_scope:
    - transformer_engine (ALL layers, including the package root and common/ Python)
    - NVTE headers
    - tests/pytorch (recursive)
    - tests/cpp
    - tests/cpp_distributed
    - tests/jax
  scope_notes: >-
    v2.3 declared "transformer_engine (all layers)" but only carried entries for
    pytorch/ and jax/. 281 lines of diverged vendored-upstream Python had no entry at
    all - transformer_engine/__init__.py, common/__init__.py, common/recipe/__init__.py.
    These are now CM-001..CM-003 and are the three files the plugin architecture depends
    on most heavily. build_tools/ and setup.py are measured (see build_system_delta) but
    remain build-system scope, not vendored-tree scope.

  previous_baseline:
    fork_sha_short: 87efe41            # dev of 2026-08-22
    upstream_merged_sha: 2e559f062497bef768dfbe9d7e45548fadeca80a
    upstream_merged_notes: >-
      The 2.17 IFU merged a commit that is on release_v2.17 but NOT on main - confirmed
      by the team as done the wrong way. It pulled 10 release-branch-only commits into
      fork history. Content residue: NONE (merge-base(fork/dev, main) is now exactly
      868d8d92 and the EP work from those commits is present at that base), so current
      measurements are unaffected. Cost was conflict burden during that IFU.
      v2.3's trend used release_v2.17 TIP, which was never merged either.

  version_streams_note: >-
    proposal (v2.2) and manifest (v2.4) version independently; the proposal pins the
    manifest version it cites.

  runtime_eligible_enum: [never, candidate, proven]
  mechanism_enum: [build-target, relocate, custom-recipe, capability, feature-pr, compat-pr,
                   upstream-pr, upstream-bugfix-pr, hold-nvidia, hold-internal, patch,
                   test-overlay, build-system, delete, restructure, mixed]
  mechanism_enum_note: >-
    v2.4.2 renamed `backend-repo` -> `build-target`. Decision 2026-08-29: all C++ stays in this
    repository; the compiled layers become separate build targets / directories, never a separate repo.
  mechanism_detail_fields: [pr_kind, capability_id, support_state, fallback_mechanism, future_options]
  metric_class_enum: [m1, migration_volume, inventory_only]
  cxx_strategy_enum: [freeze, patch-queue, native-hip]   # schema 1.4; proposal Sec 4.1a options A / B / C
  cxx_strategy_note: >-
    Per-file maintenance strategy for the 85 modified upstream C++ files after the split (all are
    hipified; 78 carry ROCm guards, ~480 sites). `patch-queue` = vendored upstream source from the
    submodule + build-time guard patches keyed by manifest ID, then hipify as today. `native-hip` =
    converted to a native HIP source and excluded from hipify. `freeze` = stop merging, port by hand -
    never acceptable as a blanket policy. Default is PROVISIONAL patch-queue pending the backtest
    C++ arm (open_decisions.cxx_maintenance_strategy). The 65 ROCm-only native files carry no
    cxx_strategy: they have no upstream ancestor.

  added_class_status: CURRENT
  added_class_notes: >-
    REGENERATED 2026-08-30 against 868d8d92 by tools/classify_hunks.py (hunk-granular = canonical-v2
    compatible; added_class_line = strict line-granular). Recovery test on 8 files whose delta is
    identical at both bases: sums v2.3 159/459/46 vs 135/477/36 (+16 header lines v2.3 folded into
    guard); the unmarked bucket matches per file. Residual per-file deltas are sidecar<->guard
    swaps, largest 29 lines (PT-004 quantization.py); unmarked never differs by more than 2. Prior text follows for history:
    Every added_class triple in this file was computed against the WRONG base and is
    retained only as a stale reference under stale_added_class. Hunk classification is
    base-dependent: upstream changed several of these files between 868d8d92 and the
    release tip, so added-line composition can shift even where the added COUNT is
    unchanged. Re-run canonical-v2 against 868d8d92 before Stage 0 exit.

  stage0_exit_requirements:
    - every leaf (feature child AND unsplit file entry) carries risk, dependencies, test_ids, upstream_link, expiry_condition
    - removed lines attributed at feature level (m1_removed_lines) or explicit removal-residue leaves
    - all RESIDUE items characterized
    - compound features split into independently retiring units (PT-006-FEAT, PT-009-FEAT)
    - mechanisms normalized to mechanism_enum with details in mechanism_detail_fields
    - "owners assigned at workstream and leaf level; executive sponsor named  -- DEFERRED 2026-08-30: no owners at this stage; `owner: TBD` fields are inert"
    - "backtest_plan thresholds numerically approved (before Stage 2 starts)  -- DONE 2026-08-30: thresholds.yaml, signed"
    # --- added in v2.4 ---
    - added_class regenerated against 868d8d92 for every entry (added_class_status == CURRENT)
    - CM-001..CM-004 fully characterized and owned
    - ABI-001 ctypes symbol inventory complete
    - ABI-002 disposition decided (carry pybind_helper.h with the torch extension, or generate its inventory from backend headers)
    - TE_ROCM_EXTENSION_API conformance covers enum VALUES, not only enum names (ABI-002-FAENUM)
    - backtest_plan.cxx_arm reporting bands approved (before Stage 2); cxx_strategy set on BK-001 (provisional allowed)
    - "release_218_gap decision recorded  -- DONE 2026-08-30 (see open_decisions)"
    - CI asserts submodule HEAD == upstream_sha == merge-base(upstream/main, fork/dev)

  correction_provenance:
    corrected_by: base re-measurement against 868d8d92, 2026-08-28
    entries_retired: 5
    entries_renumbered: 0        # IDs are stable; retired IDs are never reused
    entries_updated: 10
    entries_added: 7             # CM-001..004, ABI-001, BK-001B; v2.4.1 adds ABI-002
    entries_unchanged: 49
  v241_addendum: >-
    ABI-002 added from the static seam inventory (tools/seam_inventory.py). Not a base
    correction: a boundary finding. No layer_totals change - its 36 lines were already
    inside the common/ C++ bucket.
  v242_addendum: >-
    Two decisions recorded (2026-08-29), no measurement change. (1) Upstream is pinned as the
    submodule 3rdparty/transformer_engine_nvidia and that gitlink is the source of truth for
    upstream_sha. (2) All C++ stays in this repository: BK-001/002/003 re-dispositioned from
    `backend-repo` to `build-target`; the enum value was renamed. The compatibility obligation,
    SONAME, private core ABI and origin ledger are unchanged - they now describe build targets
    inside one repo rather than a second repo.
  v243_addendum: >-
    C++ maintenance strategy made explicit (proposal Sec 4.1a). Schema 1.4 adds cxx_strategy
    (freeze | patch-queue | native-hip), set PROVISIONALLY to patch-queue on BK-001 with measured
    cxx_facts; new open decision cxx_maintenance_strategy (due Stage 4); new backtest_plan.cxx_arm
    supplying its evidence. No measurement change.

